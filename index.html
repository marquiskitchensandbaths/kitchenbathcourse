<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen &amp; Bath Design · A 40-Hour Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{
  --paper:#E8ECEB;--sheet:#F8F9F7;--ink:#22262B;--ink2:#41474E;--stone:#646C74;
  --line:rgba(34,38,43,.14);--line2:rgba(34,38,43,.30);
  --blue:#2343A6;--blue-ink:#F8F9F7;--blue-soft:rgba(35,67,166,.09);--blue-mid:rgba(35,67,166,.24);
  --red:#BA3326;--red-soft:rgba(186,51,38,.09);
  --brass:#87611D;--brass-fill:#A87B2A;--brass-soft:rgba(168,123,42,.15);
  --wall:#3B4046;--cab:#E0E5E4;--ctr:#F1F3EF;--appf:#CDD5DA;--dim:#646C74;
  --grid:rgba(35,67,166,.08);--grid2:rgba(35,67,166,.2);
  --sans:'Barlow Semi Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --disp:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --serif:'Source Serif 4','Source Serif Pro',Georgia,'Times New Roman',serif;
  --r:4px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0C1D33;--sheet:#11284A;--ink:#E6EDF5;--ink2:#C3D0DE;--stone:#96A9BF;
  --line:rgba(230,237,245,.14);--line2:rgba(230,237,245,.32);
  --blue:#8DC2FF;--blue-ink:#0C1D33;--blue-soft:rgba(141,194,255,.12);--blue-mid:rgba(141,194,255,.3);
  --red:#FF8B7B;--red-soft:rgba(255,139,123,.13);
  --brass:#E6C173;--brass-fill:#D9B25E;--brass-soft:rgba(227,189,106,.16);
  --wall:#C7D4E4;--cab:#193459;--ctr:#15305A;--appf:#264A76;--dim:#96A9BF;
  --grid:rgba(141,194,255,.08);--grid2:rgba(141,194,255,.2);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0C1D33;--sheet:#11284A;--ink:#E6EDF5;--ink2:#C3D0DE;--stone:#96A9BF;
  --line:rgba(230,237,245,.14);--line2:rgba(230,237,245,.32);
  --blue:#8DC2FF;--blue-ink:#0C1D33;--blue-soft:rgba(141,194,255,.12);--blue-mid:rgba(141,194,255,.3);
  --red:#FF8B7B;--red-soft:rgba(255,139,123,.13);
  --brass:#E6C173;--brass-fill:#D9B25E;--brass-soft:rgba(227,189,106,.16);
  --wall:#C7D4E4;--cab:#193459;--ctr:#15305A;--appf:#264A76;--dim:#96A9BF;
  --grid:rgba(141,194,255,.08);--grid2:rgba(141,194,255,.2);color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans)}
a{color:var(--blue);text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* layout */
.app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--sheet);border-right:1.5px solid var(--ink);display:flex;flex-direction:column}
.brand{display:block;padding:22px 20px 16px;border-bottom:1px solid var(--line2);color:var(--ink);text-decoration:none}
.brand b{display:block;font:700 1.75rem/.95 var(--disp)}
.brand span{display:block;margin-top:6px;font-size:.92rem;color:var(--stone)}
.side .hrs{padding:14px 20px 12px;border-bottom:1px solid var(--line2)}
.hrs p{margin:6px 0 0;font-size:.9rem;color:var(--stone)}
.nav{padding:6px 10px 18px;flex:1}
.nav h2{font:600 .9rem/1 var(--sans);color:var(--stone);margin:18px 10px 8px}
.nav a{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:6px 10px;border-radius:var(--r);color:var(--ink);text-decoration:none;font-size:.98rem;line-height:1.25}
.nav a:hover{background:var(--blue-soft)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--sheet)}
.nav .n{font:600 1rem/1 var(--disp);color:var(--stone)}
.nav a[aria-current="page"] .n,.nav a[aria-current="page"] .st{color:inherit}
.st{font-size:.8rem;color:var(--stone);font-variant-numeric:tabular-nums}
.st.done{color:var(--brass);font-weight:700}
.sidefoot{padding:12px 16px 14px 20px;border-top:1px solid var(--line2);font-size:.85rem;color:var(--stone);display:flex;justify-content:space-between;align-items:center;gap:10px}
.linkbtn{background:none;border:1px solid var(--line2);border-radius:var(--r);padding:5px 9px;cursor:pointer;font-size:.85rem;color:var(--ink);white-space:nowrap}
.main{min-width:0;padding:34px clamp(18px,4.5vw,64px) 110px}
.topbar{display:none}
.scrim{display:none}
@media (max-width:940px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(88vw,330px);z-index:40;transform:translateX(-102%);transition:transform .22s ease;box-shadow:0 0 0 1px var(--line2)}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:35}
  .topbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:12px;padding:9px 14px;background:var(--sheet);border-bottom:1.5px solid var(--ink)}
  .topbar b{font:700 1.25rem/1 var(--disp)}
  .main{padding-top:22px}
}

/* type */
.page{max-width:1100px}
h1.pt{font:700 clamp(2.2rem,4.8vw,3.4rem)/1 var(--disp);margin:0 0 .35em}
h2.sec{font:700 1.9rem/1.05 var(--disp);margin:1.6em 0 .6em}
.lede{font:400 1.15rem/1.62 var(--serif);color:var(--ink2);max-width:64ch;margin:0 0 1.3em}
.prose{font:400 1.08rem/1.72 var(--serif);max-width:820px}
.prose>*:not(figure):not(.tw){max-width:70ch}
.prose p{margin:0 0 1em}
.prose h3{font:600 1.75rem/1.1 var(--disp);margin:1.8em 0 .5em}
.prose h4{font:600 1.2rem/1.25 var(--sans);margin:1.5em 0 .35em}
.prose ul,.prose ol{padding-left:1.35em;margin:0 0 1.1em}
.prose li{margin:.3em 0}
.prose li::marker{color:var(--stone)}
.prose b,.prose strong{font-weight:600}
.tw{overflow-x:auto;margin:1.2em 0 1.5em;border:1px solid var(--line2);border-radius:var(--r);background:var(--sheet);max-width:820px}
.prose table,.tbl{border-collapse:collapse;width:100%;font:400 .97rem/1.42 var(--sans);min-width:520px}
.prose th,.tbl th{font-weight:600;text-align:left;background:var(--blue-soft)}
.prose th,.prose td,.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.prose tr:last-child td,.tbl tr:last-child td{border-bottom:0}
aside.tip,aside.rule,aside.warn,aside.code{margin:1.3em 0;padding:.85em 1.1em;border-radius:0 var(--r) var(--r) 0;font-size:1.02rem;line-height:1.62}
aside.tip{border-left:3px solid var(--brass-fill);background:var(--brass-soft)}
aside.rule{border-left:3px solid var(--blue);background:var(--blue-soft)}
aside.warn{border-left:3px solid var(--red);background:var(--red-soft)}
aside.code{border-left:3px dashed var(--stone);background:var(--sheet)}
aside p:last-child{margin-bottom:0}
.muted{color:var(--stone)}

/* figures */
figure.fg{margin:1.7em 0 1.9em;max-width:820px}
.fgb{background:var(--sheet);border:1px solid var(--line2);border-radius:var(--r);padding:14px;overflow-x:auto}
.fig{display:block;width:100%;height:auto;min-width:540px}
.fig.sm{min-width:0;max-width:150px}
figure.fg figcaption{font:400 .95rem/1.45 var(--sans);color:var(--stone);margin-top:8px;max-width:72ch}
.fig text{font-family:var(--sans)}
.fig .o{fill:none;stroke:var(--ink);stroke-width:1.2}
.fig .o2{fill:none;stroke:var(--ink);stroke-width:2}
.fig .wl{fill:none;stroke:var(--ink);stroke-width:4.5;stroke-linejoin:miter}
.fig .gap{stroke:var(--sheet);stroke-width:7}
.fig .wall{fill:var(--wall)}
.fig .cab{fill:var(--cab);stroke:var(--ink);stroke-width:1}
.fig .ctr{fill:var(--ctr);stroke:var(--ink);stroke-width:1}
.fig .app{fill:var(--appf);stroke:var(--ink);stroke-width:1}
.fig .hid{fill:none;stroke:var(--ink);stroke-width:1;stroke-dasharray:5 3}
.fig .cl{fill:none;stroke:var(--blue);stroke-width:.9;stroke-dasharray:12 3 2 3}
.fig .dm{fill:none;stroke:var(--dim);stroke-width:.8}
.fig .tk{stroke:var(--ink);stroke-width:1.3}
.fig .sw{fill:none;stroke:var(--ink);stroke-width:.8;stroke-dasharray:3 2.5}
.fig .acc{fill:none;stroke:var(--blue);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.fig .accd{fill:none;stroke:var(--blue);stroke-width:1.5;stroke-dasharray:5 4}
.fig .redd{fill:none;stroke:var(--red);stroke-width:1.8;stroke-dasharray:6 4}
.fig .zone{fill:var(--blue);fill-opacity:.14;stroke:var(--blue);stroke-width:.8;stroke-dasharray:4 3}
.fig .zb{fill:var(--brass-fill);fill-opacity:.22;stroke:var(--brass);stroke-width:.8;stroke-dasharray:4 3}
.fig .zr{fill:var(--red);fill-opacity:.1;stroke:var(--red);stroke-width:.8;stroke-dasharray:4 3}
.fig .bluef{fill:var(--blue)}
.fig .redf{fill:var(--red)}
.fig .inkf{fill:var(--ink)}
.fig .sheetf{fill:var(--sheet);stroke:var(--ink);stroke-width:1}
.fig .glass{fill:var(--blue);fill-opacity:.12;stroke:var(--ink);stroke-width:1}
.fig .t{fill:var(--ink);font-size:11.5px;font-weight:600}
.fig .ts{fill:var(--stone);font-size:10.5px;font-weight:500}
.fig .td{fill:var(--ink);font-size:10.5px;font-weight:500}
.fig .ta{fill:var(--blue);font-size:11.5px;font-weight:700}
.fig .tr{fill:var(--red);font-size:11px;font-weight:600}
.fig .tt{fill:var(--ink);font-size:13.5px;font-weight:700}
.fig .tb{fill:var(--brass);font-size:11px;font-weight:700}
.fig .big{fill:var(--ink);font-size:17px;font-weight:700}
.hero-plan .fig{min-width:0}
.hero-plan .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawin 1.8s .35s ease-out forwards}
@keyframes drawin{to{stroke-dashoffset:0}}

/* title block */
.tblock{display:flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:var(--r);background:var(--sheet);margin:0 0 26px;max-width:820px}
.tblock>div{padding:7px 14px;border-right:1px solid var(--line2);flex:1 1 110px}
.tblock>div:last-child{border-right:0}
.tblock small{display:block;font-size:.8rem;color:var(--stone)}
.tblock span{font-weight:600}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 1rem/1.1 var(--sans);padding:.66em 1.15em;min-height:42px;border-radius:var(--r);border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);cursor:pointer;text-decoration:none}
.btn:hover{background:var(--blue-soft)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:var(--line2)}
.btn.on{border-color:var(--brass-fill);background:var(--brass-soft);color:var(--brass)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1.5px solid var(--ink);margin-top:34px;padding-top:18px;max-width:820px}
select,input[type=text],input[type=number],input[type=search],textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line2);border-radius:3px;padding:7px 9px}
textarea{width:100%;min-height:130px;font:400 1rem/1.55 var(--serif);resize:vertical}
input[type=number]{width:90px}
label.f{display:grid;gap:4px;font-size:.92rem;color:var(--stone)}
label.f span{color:var(--ink);font-weight:600}
.chk{width:22px;height:22px;flex:0 0 22px;border:1.5px solid var(--line2);border-radius:3px;display:inline-grid;place-items:center;font-size:14px;line-height:1;color:transparent}
.chk.on{background:var(--brass-fill);border-color:var(--brass-fill);color:var(--sheet)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.06fr);gap:clamp(22px,4vw,52px);align-items:center;padding-bottom:30px;margin-bottom:8px;border-bottom:1.5px solid var(--ink)}
@media (max-width:1180px){.hero{grid-template-columns:1fr}}
.hero h1{font:700 clamp(3.1rem,7.6vw,5.9rem)/.88 var(--disp);margin:0 0 .28em}
.hero p.lede{font-size:1.18rem}
.hero-plan{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r);padding:12px}
.scalebar{margin:6px 0 20px;max-width:560px}
.scalebar svg{display:block;width:100%;height:auto}
.scalebar p{margin:6px 0 0;font-size:.98rem}
.scalebar .sb-a{fill:var(--sheet);stroke:var(--ink);stroke-width:1}
.scalebar .sb-b{fill:var(--ink)}
.scalebar .sb-e{fill:var(--brass-fill);stroke:var(--ink);stroke-width:1}
.scalebar text{fill:var(--stone);font:600 11px var(--sans)}
.index{list-style:none;padding:0;margin:0;border-top:1.5px solid var(--ink);max-width:1000px}
.index li{display:grid;grid-template-columns:56px minmax(0,1fr) 70px 170px;gap:16px;align-items:center;padding:13px 6px;border-bottom:1px solid var(--line2)}
.index .num{font:700 1.8rem/1 var(--disp);color:var(--stone)}
.index a.tl{font:600 1.22rem/1.2 var(--sans);color:var(--ink);text-decoration:none}
.index a.tl:hover{color:var(--blue);text-decoration:underline}
.index .sub{font-size:.95rem;color:var(--stone);margin-top:2px}
.index .h{font:600 1.05rem var(--disp);text-align:right;color:var(--ink2)}
.index li.test{background:var(--blue-soft)}
.pm{display:grid;gap:5px;font-size:.85rem;color:var(--stone)}
.meter{height:8px;border:1px solid var(--ink);border-radius:2px;background:var(--sheet);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--brass-fill)}
@media (max-width:700px){.index li{grid-template-columns:40px minmax(0,1fr)}.index .h,.index .pm{grid-column:2;text-align:left}}
.tools-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 28px;max-width:1000px;border-top:1.5px solid var(--ink)}
.tools-list a{display:block;padding:12px 4px;border-bottom:1px solid var(--line2);color:var(--ink);text-decoration:none}
.tools-list a b{display:block;font:600 1.15rem/1.2 var(--sans)}
.tools-list a span{font-size:.95rem;color:var(--stone)}
.tools-list a:hover b{color:var(--blue);text-decoration:underline}

/* module plan of study */
.steps{list-style:none;padding:0;margin:0 0 26px;border-top:1.5px solid var(--ink);max-width:820px}
.steps a{display:grid;grid-template-columns:36px minmax(0,1fr) 74px 24px;gap:12px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line2);color:var(--ink);text-decoration:none}
.steps a:hover{background:var(--blue-soft)}
.steps .k{font:700 1.15rem/1 var(--disp);color:var(--stone)}
.steps .nm{font-weight:600;font-size:1.06rem}
.steps .ds{display:block;font-size:.92rem;color:var(--stone);font-weight:400}
.steps .m{text-align:right;color:var(--stone);font-size:.92rem;font-variant-numeric:tabular-nums}
.objs{max-width:70ch;font:400 1.05rem/1.6 var(--serif);padding-left:1.3em}

/* lab + checklists */
.cl{list-style:none;padding:0;margin:0 0 20px;max-width:820px}
.cl li{border-bottom:1px solid var(--line)}
.cl label{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;cursor:pointer;font:400 1.02rem/1.45 var(--serif)}
.cl input{position:absolute;opacity:0;pointer-events:none}
.cl input:focus-visible+.chk{outline:2px solid var(--blue);outline-offset:2px}

/* review */
.rq{border-top:1px solid var(--line2);padding:18px 0 8px;max-width:820px}
.rq h3{font:500 1.18rem/1.45 var(--serif);margin:0 0 10px}
.rq .model{margin-top:12px;padding:12px 14px;background:var(--blue-soft);border-left:3px solid var(--blue);font:400 1.02rem/1.6 var(--serif)}

/* quiz */
.qwrap{max-width:780px}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--stone);font-size:.98rem}
.qtext{font:500 1.3rem/1.45 var(--serif);margin:.45em 0 1em}
.qfig{margin:0 0 16px}
.qfig .fgb{display:inline-block}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;text-align:left;padding:12px 14px;border:1.5px solid var(--line2);border-radius:var(--r);background:var(--sheet);cursor:pointer;font:500 1.06rem/1.4 var(--sans);color:var(--ink)}
.opt:hover{border-color:var(--ink)}
.opt .l{font:700 .92rem/1 var(--disp);width:26px;height:26px;border:1.5px solid currentColor;border-radius:50%;display:grid;place-items:center;color:var(--stone)}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.opt[aria-pressed="true"] .l{color:var(--blue);background:var(--sheet)}
.opt.ok{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok .l{color:var(--blue)}
.opt.no{border-color:var(--red);background:var(--red-soft)}
.opt.no .tx{text-decoration:line-through;text-decoration-color:var(--red)}
.opt.no .l{color:var(--red)}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:0 var(--r) var(--r) 0;font:400 1.03rem/1.6 var(--serif)}
.fb.ok{background:var(--blue-soft);border-left:3px solid var(--blue)}
.fb.no{background:var(--red-soft);border-left:3px solid var(--red)}
.fb b{font-family:var(--sans)}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 6px}
.palette button{width:36px;height:34px;border:1.5px solid var(--line2);border-radius:3px;background:var(--sheet);cursor:pointer;font:600 .88rem var(--sans)}
.palette button.ans{background:var(--blue-soft);border-color:var(--blue)}
.palette button.cur{outline:2px solid var(--ink);outline-offset:1px}
.timer{font:700 1.3rem/1 var(--disp);font-variant-numeric:tabular-nums}
.timer.low{color:var(--red)}
.result{display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px;padding:18px 0 22px;border-bottom:1.5px solid var(--ink);margin-bottom:18px;max-width:820px}
.score{font:700 clamp(3.4rem,9vw,5.4rem)/.9 var(--disp)}
.stamp{display:inline-block;border:3px solid currentColor;border-radius:5px;padding:5px 14px;font:700 1.45rem/1 var(--disp);transform:rotate(-4deg)}
.stamp.pass{color:var(--blue)}
.stamp.fail{color:var(--red)}
.revlist{list-style:none;padding:0;margin:0;max-width:820px}
.revlist>li{border-bottom:1px solid var(--line2);padding:16px 0}
.revlist .q{font:500 1.08rem/1.5 var(--serif);margin:0 0 8px}
.revlist .a{font-size:1rem;margin:3px 0}
.revlist .a.ok{color:var(--blue);font-weight:600}
.revlist .a.no{color:var(--red);font-weight:600}
.revlist .e{font:400 1rem/1.55 var(--serif);color:var(--ink2);margin-top:6px}
.inline-confirm{margin-top:14px;padding:12px 14px;border:1.5px solid var(--red);border-radius:var(--r);background:var(--red-soft)}

/* flashcards: index cards */
.cardwrap{perspective:1400px;max-width:660px;margin:8px 0 18px}
.fcard{position:relative;display:block;width:100%;aspect-ratio:5/3;min-height:250px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s ease;border:0;padding:0;background:none;text-align:left}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line2);border-radius:6px;padding:52px 30px 22px 30px;display:flex;flex-direction:column;justify-content:center;overflow:auto;
  background-color:var(--sheet);
  background-image:linear-gradient(to bottom,transparent 38px,var(--red) 38px,var(--red) 39.5px,transparent 39.5px),repeating-linear-gradient(to bottom,transparent 0,transparent 29px,var(--blue-mid) 29px,var(--blue-mid) 30px);
  background-position:0 0,0 10px}
.face.back{transform:rotateY(180deg)}
.face .term{font:700 clamp(1.8rem,4.6vw,2.6rem)/1.05 var(--disp);color:var(--ink)}
.face .def{font:400 1.14rem/1.6 var(--serif);color:var(--ink)}
.face .hint{position:absolute;top:12px;left:30px;font-size:.85rem;color:var(--stone)}
.cardmeta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--stone);font-size:.95rem;margin-bottom:6px}

/* board */
.board{border:1.5px solid var(--ink);border-radius:var(--r);background:var(--sheet);overflow:hidden;max-width:1100px}
.btools{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-bottom:1px solid var(--line2);align-items:center}
.btools .sep{width:1px;height:26px;background:var(--line2);margin:0 4px}
.tool{min-width:38px;height:36px;padding:0 10px;border:1.5px solid var(--line2);border-radius:3px;background:var(--sheet);cursor:pointer;font:600 .92rem var(--sans);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btools select{height:36px;padding:0 6px}
.btools input[type=text]{height:36px;width:150px}
canvas.cv{display:block;width:100%;touch-action:none;cursor:crosshair}

/* tools / calculators */
.calcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:22px;max-width:1100px}
.calc{border:1.5px solid var(--ink);border-radius:var(--r);background:var(--sheet);padding:16px 18px}
.calc h3{font:700 1.5rem/1.05 var(--disp);margin:0 0 4px}
.calc p.d{margin:0 0 12px;color:var(--stone);font-size:.95rem}
.calc .in{display:flex;flex-wrap:wrap;gap:10px 14px;margin-bottom:12px;align-items:flex-end}
.calc .out{border-top:1px solid var(--line2);padding-top:10px;font-size:1.02rem;line-height:1.55}
.calc .out b{font-weight:700}
.okt{color:var(--blue);font-weight:700}
.badt{color:var(--red);font-weight:700}

/* glossary */
.gl{max-width:900px}
.gl dl{margin:0;border-top:1.5px solid var(--ink)}
.gl .gi{display:grid;grid-template-columns:minmax(150px,240px) minmax(0,1fr);gap:6px 22px;padding:11px 4px;border-bottom:1px solid var(--line2)}
.gl dt{font-weight:700;font-size:1.05rem}
.gl dt small{display:block;font-weight:500;color:var(--stone);font-size:.85rem}
.gl dd{margin:0;font:400 1.02rem/1.55 var(--serif)}
@media (max-width:640px){.gl .gi{grid-template-columns:1fr}}
.notes{max-width:820px;margin-top:10px}
.saved{font-size:.88rem;color:var(--stone)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .hero-plan .draw{stroke-dashoffset:0}
}
@media print{.side,.topbar,.bar,.btools{display:none!important}.app{display:block}.main{padding:0}}

/* additions: notes, calculator states, glossary search, fieldsets, reference tables */
.note{border-left:3px solid var(--brass-fill);background:var(--brass-soft);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;margin:14px 0;max-width:720px;font-size:1rem}

.bad{color:var(--red);font-weight:700}

.gsearch{width:100%;max-width:520px;height:44px;margin:4px 0 8px;font-size:1.05rem}
dl.gl{margin:0;border-top:1.5px solid var(--ink)}
fieldset.leg{border:0;padding:0;margin:0;min-width:0}
fieldset.leg legend{padding:0;margin:0 0 4px;color:var(--ink);font-weight:600;font-size:.92rem}

fieldset.leg input[type=number]{width:74px}
.calc .in{flex-direction:row}

h1[tabindex="-1"]:focus{outline:none}
@media (max-width:640px){.tblock>div{flex:1 1 90px;padding:7px 10px}.tblock>div:first-child{flex-basis:100%;border-right:0;border-bottom:1px solid var(--line2)}}

<div class="topbar"><button class="linkbtn" id="menuBtn" aria-controls="side" aria-expanded="false">Menu</button><b>Kitchen &amp; Bath Design</b></div>

<script>
/* Kitchen & Bath Design course: SVG figure library (all plans drawn in inches) */
window.FIGS = (function () {
  const E = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  const r1 = n => Math.round(n * 10) / 10;
  const svg = (w, h, body, label, cls) => `<svg class="fig${cls ? ' ' + cls : ''}" viewBox="0 0 ${r1(w)} ${r1(h)}" role="img" aria-label="${E(label)}">${body}</svg>`;
  const ftin = v => { let f = Math.floor(v / 12), i = Math.round(v - f * 12); if (i === 12) { f++; i = 0; } return `${f}'-${i}"`; };
  const TK = (x, y) => `<line x1="${r1(x - 3.5)}" y1="${r1(y + 3.5)}" x2="${r1(x + 3.5)}" y2="${r1(y - 3.5)}" class="tk"/>`;

  function Pad(s, ox, oy, flip) {
    const X = x => r1(ox + x * s);
    const Y = y => r1(oy + (flip == null ? y : flip - y) * s);
    const o = [];
    const A = {
      s, X, Y, o,
      add(t) { o.push(t); return A; },
      rect(x, y, w, h, c = 'o', ex = '') { const top = flip == null ? Y(y) : Y(y + h); o.push(`<rect x="${X(x)}" y="${top}" width="${r1(w * s)}" height="${r1(h * s)}" class="${c}"${ex ? ' ' + ex : ''}/>`); return A; },
      line(x1, y1, x2, y2, c = 'o') { o.push(`<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" class="${c}"/>`); return A; },
      poly(pts, c = 'o', closed = true) { o.push(`<${closed ? 'polygon' : 'polyline'} points="${pts.map(p => X(p[0]) + ',' + Y(p[1])).join(' ')}" class="${c}"/>`); return A; },
      circ(x, y, r, c = 'o') { o.push(`<circle cx="${X(x)}" cy="${Y(y)}" r="${r1(r * s)}" class="${c}"/>`); return A; },
      ell(x, y, rx, ry, c = 'o') { o.push(`<ellipse cx="${X(x)}" cy="${Y(y)}" rx="${r1(rx * s)}" ry="${r1(ry * s)}" class="${c}"/>`); return A; },
      text(x, y, t, c = 't', a = 'middle', rot = 0) { const xx = X(x), yy = Y(y); o.push(`<text x="${xx}" y="${yy}" class="${c}" text-anchor="${a}"${rot ? ` transform="rotate(${rot} ${xx} ${yy})"` : ''}>${E(t)}</text>`); return A; },
      hdim(x1, x2, y, label, from) {
        const a = X(x1), b = X(x2), yy = Y(y); let t = '';
        if (from != null) { const yf = Y(from), d = yy < yf ? -1 : 1; t += `<line x1="${a}" y1="${r1(yf + d * 3)}" x2="${a}" y2="${r1(yy + d * 4)}" class="dm"/><line x1="${b}" y1="${r1(yf + d * 3)}" x2="${b}" y2="${r1(yy + d * 4)}" class="dm"/>`; }
        t += `<line x1="${a}" y1="${yy}" x2="${b}" y2="${yy}" class="dm"/>${TK(a, yy)}${TK(b, yy)}`;
        if (label) t += `<text x="${r1((a + b) / 2)}" y="${r1(yy - 4)}" class="td" text-anchor="middle">${E(label)}</text>`;
        o.push(t); return A;
      },
      vdim(y1, y2, x, label, from) {
        const a = Y(y1), b = Y(y2), xx = X(x); let t = '';
        if (from != null) { const xf = X(from), d = xx < xf ? -1 : 1; t += `<line x1="${r1(xf + d * 3)}" y1="${a}" x2="${r1(xx + d * 4)}" y2="${a}" class="dm"/><line x1="${r1(xf + d * 3)}" y1="${b}" x2="${r1(xx + d * 4)}" y2="${b}" class="dm"/>`; }
        const my = r1((a + b) / 2);
        t += `<line x1="${xx}" y1="${a}" x2="${xx}" y2="${b}" class="dm"/>${TK(xx, a)}${TK(xx, b)}`;
        if (label) t += `<text x="${r1(xx - 4)}" y="${my}" class="td" text-anchor="middle" transform="rotate(-90 ${r1(xx - 4)} ${my})">${E(label)}</text>`;
        o.push(t); return A;
      },
      door(hx, hy, len, a0, a1) {
        const R = d => d * Math.PI / 180, px = a => X(hx + len * Math.cos(R(a))), py = a => Y(hy + len * Math.sin(R(a)));
        o.push(`<line x1="${X(hx)}" y1="${Y(hy)}" x2="${px(a1)}" y2="${py(a1)}" class="o2"/><path d="M${px(a0)} ${py(a0)}A${r1(len * s)} ${r1(len * s)} 0 0 ${a1 > a0 ? 1 : 0} ${px(a1)} ${py(a1)}" class="sw"/>`);
        return A;
      },
      out(w, h, label, cls) { return svg(w, h, o.join(''), label, cls); }
    };
    return A;
  }
  const burners = (p, x, y, w, h) => { p.rect(x, y, w, h, 'app'); const r = Math.min(w, h) * 0.15; [[1, 1], [3, 1], [1, 3], [3, 3]].forEach(([i, j]) => p.circ(x + w / 4 * i, y + h / 4 * j, r, 'o')); };
  const sink = (p, x, y, w, h) => { p.rect(x, y, w, h, 'sheetf', 'rx="3"'); p.circ(x + w / 2, y + h / 2, 1.1, 'o'); };
  const swingV = (p, xh, xf, y0, y1) => { const m = (y0 + y1) / 2; p.line(xf, y1, xh, m, 'hid'); p.line(xf, y0, xh, m, 'hid'); };

  const F = {};

  /* ---------- Module 2 ---------- */
  F.colorWheel = () => {
    const C = [['Yellow', '#F2CF1D', 'P', 1], ['Yellow-orange', '#F5A51C', 'T', 1], ['Orange', '#EE7F1B', 'S', 1], ['Red-orange', '#E2552B', 'T', 0], ['Red', '#C9302C', 'P', 0], ['Red-violet', '#A7356E', 'T', 0], ['Violet', '#6F3E96', 'S', 0], ['Blue-violet', '#4A4FA2', 'T', 0], ['Blue', '#2C66B0', 'P', 0], ['Blue-green', '#18918A', 'T', 0], ['Green', '#35A34A', 'S', 0], ['Yellow-green', '#98C23A', 'T', 1]];
    const cx = 215, cy = 188, R = 120, r = 54; let b = '';
    const pt = (rad, deg) => [r1(cx + rad * Math.cos(deg * Math.PI / 180)), r1(cy + rad * Math.sin(deg * Math.PI / 180))];
    C.forEach(([n, col, k, dark], i) => {
      const m = -90 + i * 30, [x0, y0] = pt(R, m - 15), [x1, y1] = pt(R, m + 15), [x2, y2] = pt(r, m + 15), [x3, y3] = pt(r, m - 15);
      b += `<path d="M${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 0 0 ${x3} ${y3}Z" fill="${col}" stroke="var(--sheet)" stroke-width="2"/>`;
      const [kx, ky] = pt((R + r) / 2, m); b += `<text x="${kx}" y="${r1(ky + 4)}" text-anchor="middle" style="fill:${dark ? '#1d1d1d' : '#fff'};font-size:12px;font-weight:700">${k}</text>`;
      const [lx, ly] = pt(R + 12, m), c = Math.cos(m * Math.PI / 180);
      b += `<text x="${lx}" y="${r1(ly + 4)}" text-anchor="${c > 0.25 ? 'start' : c < -0.25 ? 'end' : 'middle'}" class="ts">${n}</text>`;
    });
    b += `<text x="${cx}" y="${cy + 4}" text-anchor="middle" class="t">RYB wheel</text>`;
    const hex = n => C.find(c => c[0] === n)[1];
    const sch = [['Complementary', ['Blue', 'Orange']], ['Analogous', ['Blue-green', 'Green', 'Yellow-green']], ['Triadic', ['Red', 'Yellow', 'Blue']], ['Split-complementary', ['Yellow', 'Red-violet', 'Blue-violet']]];
    let y = 40;
    const sw = (cols) => cols.map((c, j) => `<rect x="${425 + j * 34}" y="${y + 7}" width="30" height="20" rx="2" fill="${c}" stroke="var(--ink)" stroke-width=".6"/>`).join('');
    sch.forEach(([nm, cs]) => { b += `<text x="425" y="${y}" class="t">${nm}</text>` + sw(cs.map(hex)); y += 54; });
    b += `<text x="425" y="${y}" class="t">Monochromatic (tints and shades)</text>` + sw(['#1A3E6E', '#2C66B0', '#6E9AD2', '#B8CEEA']);
    y += 52; b += `<text x="425" y="${y}" class="ts">P primary, S secondary, T tertiary</text>`;
    return svg(650, 345, b, 'Twelve-hue RYB color wheel with example color schemes');
  };

  F.balance = () => {
    let b = '';
    b += `<line x1="20" y1="222" x2="320" y2="222" class="o2"/><rect x="30" y="165" width="280" height="57" class="cab"/><rect x="26" y="159" width="288" height="6" class="ctr"/>`;
    b += `<rect x="140" y="165" width="60" height="57" class="app"/><rect x="148" y="178" width="44" height="24" rx="2" class="sheetf"/>`;
    b += `<polygon points="152,78 188,78 210,118 130,118" class="cab"/><rect x="158" y="22" width="24" height="56" class="cab"/>`;
    b += `<rect x="30" y="40" width="96" height="70" class="cab"/><line x1="78" y1="40" x2="78" y2="110" class="o"/><rect x="214" y="40" width="96" height="70" class="cab"/><line x1="262" y1="40" x2="262" y2="110" class="o"/>`;
    [[30, 110], [200, 110]].forEach(([x, w]) => { for (let i = 1; i < 3; i++) b += `<line x1="${r1(x + w * i / 3)}" y1="165" x2="${r1(x + w * i / 3)}" y2="222" class="o"/>`; });
    b += `<line x1="170" y1="12" x2="170" y2="232" class="cl"/><text x="170" y="252" class="tt" text-anchor="middle">Symmetrical</text><text x="170" y="268" class="ts" text-anchor="middle">Mirror image about a centerline</text>`;
    const X = 350;
    b += `<line x1="${X + 10}" y1="222" x2="${X + 310}" y2="222" class="o2"/><rect x="${X + 20}" y="22" width="64" height="200" class="cab"/><line x1="${X + 52}" y1="22" x2="${X + 52}" y2="222" class="o"/><line x1="${X + 20}" y1="120" x2="${X + 84}" y2="120" class="o"/>`;
    b += `<rect x="${X + 84}" y="165" width="216" height="57" class="cab"/><rect x="${X + 84}" y="159" width="220" height="6" class="ctr"/>`;
    for (let i = 1; i < 4; i++) b += `<line x1="${X + 84 + 54 * i}" y1="165" x2="${X + 84 + 54 * i}" y2="222" class="o"/>`;
    b += `<rect x="${X + 190}" y="36" width="96" height="100" class="glass"/><line x1="${X + 238}" y1="36" x2="${X + 238}" y2="136" class="o"/><line x1="${X + 190}" y1="86" x2="${X + 286}" y2="86" class="o"/>`;
    b += `<line x1="${X + 96}" y1="70" x2="${X + 176}" y2="70" class="o2"/><line x1="${X + 96}" y1="110" x2="${X + 176}" y2="110" class="o2"/><rect x="${X + 106}" y="52" width="10" height="18" class="app"/><rect x="${X + 122}" y="58" width="16" height="12" class="app"/><rect x="${X + 150}" y="94" width="18" height="16" class="app"/>`;
    b += `<text x="${X + 160}" y="252" class="tt" text-anchor="middle">Asymmetrical</text><text x="${X + 160}" y="268" class="ts" text-anchor="middle">Tall pantry balanced by a window and open shelves</text>`;
    return svg(680, 280, b, 'Symmetrical and asymmetrical balance on kitchen elevations');
  };

  F.golden = () => {
    const H = 200, W = H * 1.6180339, x0 = 36, y0 = 30;
    let b = `<rect x="${x0}" y="${y0}" width="${r1(W)}" height="${H}" class="o2"/>`, pth = '';
    let x = x0, y = y0, w = W, h = H;
    const sq = (a, c, s) => `<rect x="${r1(a)}" y="${r1(c)}" width="${r1(s)}" height="${r1(s)}" class="dm"/>`;
    const arc = (sx, sy, ex, ey, s) => `M${r1(sx)} ${r1(sy)}A${r1(s)} ${r1(s)} 0 0 1 ${r1(ex)} ${r1(ey)}`;
    for (let i = 0; i < 9; i++) {
      const d = i % 4; let s;
      if (d === 0) { s = h; b += sq(x, y, s); pth += arc(x, y + s, x + s, y, s); x += s; w -= s; }
      else if (d === 1) { s = w; b += sq(x, y, s); pth += arc(x, y, x + s, y + s, s); y += s; h -= s; }
      else if (d === 2) { s = h; b += sq(x + w - s, y, s); pth += arc(x + w, y, x + w - s, y + s, s); w -= s; }
      else { s = w; b += sq(x, y + h - s, s); pth += arc(x + w, y + h, x, y + h - s, s); h -= s; }
    }
    b += `<path d="${pth}" class="acc"/><text x="${x0 - 10}" y="${y0 + H / 2 + 4}" class="t" text-anchor="end">1</text><text x="${r1(x0 + W / 2)}" y="${y0 - 10}" class="t" text-anchor="middle">1.618</text>`;
    const X = 440, s = 5.2, top = 60, hs = [6, 9, 15];
    let yy = top;
    b += `<text x="${X + 62}" y="40" class="t" text-anchor="middle">Graduated drawers</text>`;
    hs.forEach(hh => { b += `<rect x="${X}" y="${yy}" width="${24 * s}" height="${r1(hh * s)}" class="cab"/><line x1="${X + 44}" y1="${r1(yy + 10)}" x2="${X + 80}" y2="${r1(yy + 10)}" class="o2"/><text x="${X + 24 * s + 8}" y="${r1(yy + hh * s / 2 + 4)}" class="td">${hh}"</text>`; yy += hh * s; });
    b += `<text x="${X + 62}" y="${r1(yy + 20)}" class="ts" text-anchor="middle">Rhythm by progression</text>`;
    return svg(620, 262, b, 'Golden rectangle subdivided into squares, and a graduated drawer bank');
  };

  /* ---------- Module 3 ---------- */
  F.lineTypes = () => {
    const rows = [['Object (visible)', 'Walls cut in plan, cabinets, counters'], ['Hidden', 'Wall cabinets and soffits on a floor plan'], ['Centerline', 'Centers of fixtures, appliances, openings'], ['Dimension', 'Distance between extension lines'], ['Extension', 'Carries a feature out to the dimension line'], ['Leader', 'Points a note to a feature'], ['Break', 'Shows a drawing is cut short'], ['Cutting plane', 'Where a section is taken; arrows show the view'], ['Phantom', 'Alternate positions, like an open door']];
    let b = ''; const x1 = 260, x2 = 600;
    rows.forEach(([n, d], i) => {
      const y = 34 + i * 40;
      b += `<text x="16" y="${y}" class="t">${n}</text><text x="16" y="${y + 14}" class="ts">${d}</text>`;
      const L = st => `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" style="${st}"/>`;
      if (i === 0) b += L('stroke:var(--ink);stroke-width:2.8');
      if (i === 1) b += L('stroke:var(--ink);stroke-width:1.4;stroke-dasharray:9 5');
      if (i === 2) b += L('stroke:var(--ink);stroke-width:1;stroke-dasharray:24 4 4 4') + `<text x="${x2 + 8}" y="${y + 4}" class="ts">CL</text>`;
      if (i === 3) b += `<line x1="${x1 + 40}" y1="${y}" x2="${x2 - 40}" y2="${y}" class="dm"/>${TK(x1 + 40, y)}${TK(x2 - 40, y)}<text x="${(x1 + x2) / 2}" y="${y - 5}" class="td" text-anchor="middle">36"</text><line x1="${x1 + 40}" y1="${y - 13}" x2="${x1 + 40}" y2="${y + 6}" class="dm"/><line x1="${x2 - 40}" y1="${y - 13}" x2="${x2 - 40}" y2="${y + 6}" class="dm"/>`;
      if (i === 4) b += `<line x1="${x1}" y1="${y - 10}" x2="${x1 + 160}" y2="${y - 10}" style="stroke:var(--ink);stroke-width:2.4"/><line x1="${x1 + 20}" y1="${y - 6}" x2="${x1 + 20}" y2="${y + 12}" class="dm"/><line x1="${x1 + 140}" y1="${y - 6}" x2="${x1 + 140}" y2="${y + 12}" class="dm"/><text x="${x1 + 176}" y="${y + 4}" class="ts">small gap at the object</text>`;
      if (i === 5) b += `<path d="M${x1 + 10} ${y + 8}L${x1 + 70} ${y - 6}H${x1 + 110}" class="dm"/><polygon points="${x1 + 10},${y + 8} ${x1 + 23},${y + 1} ${x1 + 21},${y + 10}" class="inkf"/><text x="${x1 + 116}" y="${y - 2}" class="ts">Note text</text>`;
      if (i === 6) b += `<polyline points="${x1},${y} ${x1 + 170},${y} ${x1 + 178},${y - 10} ${x1 + 188},${y + 10} ${x1 + 196},${y} ${x2},${y}" style="fill:none;stroke:var(--ink);stroke-width:1"/>`;
      if (i === 7) b += `<line x1="${x1 + 10}" y1="${y}" x2="${x2 - 10}" y2="${y}" style="stroke:var(--ink);stroke-width:2.8;stroke-dasharray:28 5 6 5"/><path d="M${x1 + 10} ${y}V${y + 12}M${x2 - 10} ${y}V${y + 12}" style="stroke:var(--ink);stroke-width:2.2"/><polygon points="${x1 + 4},${y + 10} ${x1 + 16},${y + 10} ${x1 + 10},${y + 20}" class="inkf"/><polygon points="${x2 - 16},${y + 10} ${x2 - 4},${y + 10} ${x2 - 10},${y + 20}" class="inkf"/><text x="${x1 - 6}" y="${y + 4}" class="t" text-anchor="end">A</text><text x="${x2 + 6}" y="${y + 4}" class="t">A</text>`;
      if (i === 8) b += L('stroke:var(--ink);stroke-width:1;stroke-dasharray:22 4 4 4 4 4');
    });
    return svg(640, 390, b, 'Line types used in kitchen and bath drawings');
  };

  F.symbols = () => {
    let b = `<text x="20" y="22" class="tt">Openings</text><text x="370" y="22" class="tt">Electrical and lighting</text>`;

obj: [`Describe the roles, work settings and credentials in the kitchen and bath industry.`, `Put the phases of a design project in order and name the deliverable of each.`, `Run a structured client interview.`, `Write a design program that separates needs, wants and constraints.`],

{ id: `m1l1`, t: `What a kitchen & bath designer does`, min: 25, h: `
<p>Kitchens and bathrooms are the most technically dense rooms in a house. In a few hundred square feet they combine water, drains, gas, high-amperage circuits, ventilation, heavy appliances, hot surfaces and wet floors, and everyone in the household uses them every day. A kitchen and bath (K&amp;B) designer turns that complexity into rooms that are safe, efficient, buildable and beautiful.</p>
<h3>What the work includes</h3>
<ul>
<li><b>Listening and interpreting.</b> Interviewing clients, observing how they live, and translating it into a design program.</li>
<li><b>Documenting the site.</b> Measuring accurately and recording existing structure, plumbing, electrical and ventilation.</li>
<li><b>Space planning.</b> Arranging work centers, fixtures, clearances and storage for the specific people who will use the room.</li>
<li><b>Selecting and specifying.</b> Cabinetry, counters, appliances, plumbing fixtures, tile, lighting and hardware, each with model numbers, sizes and finishes.</li>
<li><b>Drawing.</b> Floor plans, elevations, mechanical plans and renderings that clients approve and installers build from.</li>
<li><b>Estimating and selling.</b> Pricing the work, presenting options and trade-offs, and closing agreements.</li>
<li><b>Coordinating.</b> Working with contractors, plumbers, electricians, fabricators and inspectors, and managing changes through the final walkthrough.</li>
</ul>
<h3>Where designers work</h3>
<table><thead><tr><th>Setting</th><th>Typical pay structure</th><th>What the work looks like</th></tr></thead><tbody>
<tr><td>Kitchen and bath showroom or dealer</td><td>Salary plus commission; design fee often credited toward a purchase</td><td>Design around the cabinet and product lines the showroom sells</td></tr>
<tr><td>Independent design firm</td><td>Design fees (flat, hourly or percentage), sometimes product markup</td><td>Full design services; the client hires a contractor, or the firm manages one</td></tr>
<tr><td>Design-build or remodeling firm</td><td>Salary; design folded into the construction contract</td><td>Design and construction under one agreement</td></tr>
<tr><td>Home center</td><td>Hourly plus incentives</td><td>High volume, stock and semi-custom lines, short design cycles</td></tr>
<tr><td>Builder, manufacturer, or architecture and interiors firm</td><td>Salary</td><td>New-home selections, dealer support, or the K&amp;B specialist on a larger team</td></tr>
</tbody></table>
<h3>Knowing your limits</h3>
<p>Designers show intent; licensed professionals verify and execute. Removing or altering load-bearing walls, sizing beams, designing electrical services and gas piping, and most plumbing work must be done or approved by licensed professionals under local law. Drawings commonly carry a note that structural, mechanical and electrical details are to be verified by qualified professionals and that all work must meet applicable codes. Some U.S. states also regulate who may call themselves an interior designer, so learn the rules where you practice.</p>
<h3>The industry and its credentials</h3>
<p>The National Kitchen &amp; Bath Association (NKBA) is the trade association for the North American K&amp;B industry. It publishes widely used kitchen and bathroom planning guidelines and certifies designers at several levels: Associate Kitchen &amp; Bath Designer (AKBD), Certified Kitchen Designer (CKD), Certified Bath Designer (CBD) and Certified Master Kitchen &amp; Bath Designer (CMKBD). Each level combines education, industry experience and exams; check NKBA's current requirements before planning your path. Related credentials include the National Association of Home Builders' Certified Aging-in-Place Specialist (CAPS) and, for interior designers, NCIDQ certification.</p>
<aside class="rule"><p><b>About the numbers in this course.</b> Dimensions come from widely published industry guidelines, especially NKBA's kitchen and bathroom planning guidelines, and from U.S. model codes such as the International Residential Code (IRC) and National Electrical Code (NEC). Guidelines are recommendations. Codes are law only where adopted, and jurisdictions amend them. Always confirm the editions your building department enforces and follow the manufacturer's installation instructions. This course is independent and isn't affiliated with or endorsed by NKBA.</p></aside>
<h3>Professional conduct</h3>
<p>Represent your credentials honestly, respect the client's budget, disclose how you are paid when it affects your recommendations, keep client information confidential, credit other people's work, and never trade safety for appearance. Products, codes and building science change every year, so the best designers stay curious and keep learning.</p>` },
{ id: `m1l2`, t: `The design process`, min: 25, h: `
<p>Every firm adapts it, but most K&amp;B projects move through the same sequence. Knowing where you are in the process tells you which decisions the client should be making and which documents you owe them.</p>
<ol>
<li><b>First contact and qualifying.</b> Learn the scope, rough budget, timeline and who makes decisions. Explain your process and fees. A project that doesn't fit your services is better referred early.</li>
<li><b>Client interview and survey.</b> Learn how the household lives, cooks, bathes, stores and entertains (next lesson).</li>
<li><b>Site visit and field measure.</b> Record dimensions and existing conditions (Module 4).</li>
<li><b>Programming and analysis.</b> Organize needs, wants and constraints into a written design program. Flag code, structural and budget issues.</li>
<li><b>Schematic design.</b> Explore two or three alternative layouts with bubble diagrams and quick plans, each with a rough cost, so the client chooses a direction with open eyes.</li>
<li><b>Design development.</b> Refine the chosen plan, draw elevations, select cabinetry, surfaces, appliances, fixtures and lighting, and coordinate mechanical needs.</li>
<li><b>Presentation.</b> Present drawings, renderings, samples and an estimate, and record the client's decisions.</li>
<li><b>Agreement, specifications and ordering.</b> Finalize selections, sign the agreement, collect the deposit, verify field dimensions with a check measure, and place orders.</li>
<li><b>Installation and project management.</b> Sequence the trades, visit the site, solve surprises, and document every change with a signed change order.</li>
<li><b>Completion.</b> Walk the project with the client, finish the punch list, hand over care and warranty information, collect final payment, photograph the work and follow up.</li>
</ol>
<h3>Charging for design</h3>
<p>Common arrangements include a design retainer paid up front (sometimes credited toward product purchases), a flat design fee, hourly billing, a percentage of the project cost, or design included in a design-build contract. Whatever the model, put the scope of design services in writing: how many layout options, how many revision rounds, which drawings are included, and what happens if the client takes the plans elsewhere.</p>
<h3>Decisions are milestones</h3>
<p>Design is iterative, but approvals are not. Have the client sign or initial the final floor plan and elevations before anything is ordered. The most expensive mistakes in this business are ordering mistakes: a wrong hinge side, a cabinet two inches too wide, an appliance that doesn't fit its cutout. A signed drawing set is both a quality check and a record of what the client approved.</p>
<aside class="tip"><p><b>Designer's tip.</b> Keep a decision log for every project: the date, the decision, who approved it, and which drawing or specification it changed. When memories differ six weeks later, the log settles it.</p></aside>` },
{ id: `m1l3`, t: `The client interview & design program`, min: 25, h: `
<p>A kitchen or bath fails when it's designed for an imaginary user. The interview replaces assumptions with facts about real people: how tall they are, which hand they favor, how they cook, what they own, and what drives them crazy about the room they have now.</p>
<h3>What to ask</h3>
<table><thead><tr><th>Topic</th><th>Examples</th></tr></thead><tbody>
<tr><td>Household</td><td>Who uses the room? Ages, heights, handedness, mobility or vision limits, pets. Plans for children, aging parents, or aging in place?</td></tr>
<tr><td>Cooking and use</td><td>Who cooks, how often, and how many cook at once? Baking, canning, entertaining, take-out? Where do people eat, do homework, charge phones?</td></tr>
<tr><td>Storage inventory</td><td>Cookware, small appliances, dishes, glassware, trays, spices, pantry and bulk items, cleaning supplies, recycling and compost.</td></tr>
<tr><td>Appliances and fixtures</td><td>Keep or replace? Fuel preference? Special items such as a steam oven, wine storage, two dishwashers or a pot filler?</td></tr>
<tr><td>Bath routines</td><td>Who shares the room and when? Tub, shower or both? Makeup and shaving, toiletry and linen storage, heated floors, towel warmers.</td></tr>
<tr><td>Style</td><td>Inspiration images, and what specifically they like in each. Colors, materials and finishes they love or dislike.</td></tr>
<tr><td>Project</td><td>Budget range, timeline, how long they plan to stay, resale concerns, where they'll live during construction, HOA or condo rules.</td></tr>
</tbody></table>
<h3>How to ask</h3>
<ul>
<li>Use open questions. "Walk me through a weekday morning" reveals more than "Do you need more counter space?"</li>
<li>Ask what works in the current room, not only what doesn't. People often rely on habits they don't notice.</li>
<li>Observe. With permission, open cabinets and look at what lives on the counters: those items have no home.</li>
<li>Paraphrase what you heard and write it down during the meeting.</li>
<li>Talk about budget in ranges and trade-offs, and explain what drives cost so the client can set priorities.</li>
</ul>
<h3>Writing the design program</h3>
<p>The program is a one- or two-page summary that guides every later decision. A useful structure:</p>
<ul>
<li><b>Goals:</b> two or three sentences on what success looks like.</li>
<li><b>Users:</b> who uses the room, with the facts that affect dimensions.</li>
<li><b>Needs:</b> requirements the design must meet, such as function, safety, code and household realities.</li>
<li><b>Wants:</b> desirable features, ranked, so they can be traded against budget and space.</li>
<li><b>Constraints:</b> budget, structure, existing mechanicals, codes, timeline, HOA rules.</li>
<li><b>Style direction:</b> three to five words the client agrees with, plus reference images.</li>
</ul>
<aside class="tip"><p><b>Example.</b> Needs: two people cooking at once; a lower baking counter for a stand mixer; seating for three. Wants, ranked: (1) walk-in pantry, (2) 48" range, (3) beverage refrigerator. Constraints: $95,000 budget including appliances; the wall between kitchen and dining room is load-bearing.</p></aside>
<p>When space or money runs short, needs are protected and wants are traded in rank order. The program keeps that conversation calm instead of personal.</p>` }
],

COURSE.modules.push({
id: `m2`, n: 2, title: `Design elements, principles & color`,
sum: `The visual vocabulary of design: the elements you compose with, the principles that arrange them, the color theory behind finish selections, and the style words clients use.`,
obj: [`Identify the elements of design in kitchens and baths.`, `Apply balance, rhythm, emphasis, proportion and scale to elevations.`, `Build color schemes using hue, value and chroma, and avoid undertone clashes.`, `Describe major style directions and their typical materials.`],
lessons: [
{ id: `m2l1`, t: `Elements of design`, min: 30, h: `
<p>The elements of design are the raw materials you compose with. Every cabinet run, tile field and light fixture is made of them, and learning to see them separately is the first step to controlling them.</p>
<h3>Line</h3>
<p>Line leads the eye and sets mood. Horizontal lines, such as long counter runs, stacked tile and horizontal-grain slab doors, feel calm and make a space read wider. Vertical lines, such as tall pantries, vertically stacked tile and fluted panels, add height and formality. Diagonal lines, such as herringbone floors and angled islands, bring energy. Curved lines, such as arched hoods, round mirrors and radius island ends, soften a room full of boxes.</p>
<h3>Shape and form</h3>
<p>Shape is two-dimensional (a door panel, a tile); form is three-dimensional (an island, a freestanding tub). Geometric shapes read as orderly and modern; organic shapes read as natural and relaxed. Repeating a shape, such as an arch in the hood, the mirror and a window, is a simple way to create unity.</p>
<h3>Space</h3>
<p>Positive space is occupied; negative space is the air around things. Negative space lets a room breathe and lets important objects stand out. A freestanding tub needs open floor around it to read as sculpture, and open shelves only look calm if they aren't crammed.</p>
<h3>Texture</h3>
<p>Texture is both tactile (how a surface feels) and visual (how it looks). Rough, matte surfaces absorb light and feel warm and casual; smooth, glossy surfaces reflect light and feel crisp. Texture affects maintenance too: deeply textured tile or stone traps grime behind a range and on shower floors.</p>
<h3>Pattern</h3>
<p>Pattern is a repeated motif: tile layouts, stone veining, wallpaper, even the rhythm of cabinet doors. Scale the pattern to the surface and the viewing distance. A busy small mosaic across a whole wall can read as noise; the same tile in a niche becomes a jewel.</p>
<h3>Light and color</h3>
<p>Light reveals every other element. The same stone looks different under north light, afternoon sun and warm LEDs; Module 10 covers lighting design. Color is the most emotional element and the easiest to get wrong, so it gets its own lesson.</p>
<aside class="tip"><p><b>Seeing exercise.</b> Look at any kitchen photo and name the dominant line direction, the largest mass, the main texture contrast and where the negative space is. Designers who can name these can change them on purpose.</p></aside>` },
{ id: `m2l2`, t: `Principles of design`, min: 30, h: `
<p>The principles describe how elements are arranged. They aren't rules so much as a vocabulary for explaining why a composition works, or why it doesn't.</p>
<h3>Balance</h3>
<p><b>Symmetrical balance</b> mirrors elements about a centerline, like a range centered on the wall with matching cabinets on either side. It feels formal and restful. <b>Asymmetrical balance</b> uses different elements of equal visual weight, like a tall pantry at one end balanced by a window and open shelves at the other. It feels relaxed and current. <b>Radial balance</b> arranges elements around a center, like stools around a round island.</p>
<fig name="balance">Visual weight comes from size, darkness, texture and detail. A dark tall pantry weighs more than a light window of the same size.</fig>
<h3>Rhythm</h3>
<p>Rhythm is organized repetition that moves the eye. <b>Repetition</b> repeats one element (pendants, door modules). <b>Alternation</b> repeats two elements in turn (glass and solid doors). <b>Progression</b> changes size in steps, like drawer fronts that grow toward the floor. <b>Transition</b> uses curves to lead the eye, and <b>contrast</b> sets opposites side by side.</p>
<h3>Emphasis</h3>
<p>Every room needs one focal point: a hood, a tile feature, a statement island, a freestanding tub. Decide where the eye should land from the doorway and keep everything else quieter. Two competing focal points cancel each other out.</p>
<h3>Proportion and scale</h3>
<p><b>Proportion</b> is the relationship of parts to each other and to the whole, like drawer heights within a cabinet or the width of a hood relative to the range below. <b>Scale</b> is size relative to the human body and to the room: a 60" hood can overwhelm a small kitchen, and a 30" vanity can look lost in a large primary bath. The golden ratio, about 1 to 1.618, is a classic proportioning tool; the rule of thirds is its simpler cousin.</p>
<fig name="golden">Removing a square from a golden rectangle leaves another golden rectangle. Graduated drawer heights apply the same idea of pleasing progression.</fig>
<h3>Harmony, unity and variety</h3>
<p>Unity comes from repeating finishes, lines and shapes so the room reads as one idea. Variety keeps it from becoming monotonous. Too much unity is dull; too much variety is chaos. A good test is whether you can describe the room's concept in one sentence.</p>
<h3>The 60-30-10 guideline</h3>
<p>A simple way to distribute color is about 60% dominant (often cabinetry or walls), 30% secondary (counters, floor or island) and 10% accent (hardware, a tile feature, lighting). Treat it as a starting point, not a formula.</p>` },
{ id: `m2l3`, t: `Color theory`, min: 30, h: `
<p>Color decisions in kitchens and baths are expensive to reverse. Paint is easy to change; cabinetry, tile and stone are not. Working knowledge of color theory lets you predict how selections will behave together before they are installed.</p>
<h3>The color wheel</h3>
<p>Designers typically use the traditional red-yellow-blue (RYB) wheel. The <b>primaries</b> are red, yellow and blue. Mixing pairs of primaries gives the <b>secondaries</b>: orange, green and violet. Mixing a primary with a neighboring secondary gives the six <b>tertiaries</b>, such as blue-green and red-orange.</p>
<fig name="colorWheel">Color schemes are defined by position on the wheel. Most successful kitchens and baths use a restrained scheme plus neutrals.</fig>
<h3>Three properties of color</h3>
<ul>
<li><b>Hue</b> is the color family, such as red or blue-green.</li>
<li><b>Value</b> is lightness or darkness. Adding white makes a <b>tint</b>; adding black makes a <b>shade</b>.</li>
<li><b>Chroma</b>, also called intensity or saturation, is purity. Adding gray makes a <b>tone</b> and lowers chroma. Most livable interior colors are low to medium chroma.</li>
</ul>
<h3>Color schemes</h3>
<table><thead><tr><th>Scheme</th><th>Definition</th><th>K&amp;B example</th></tr></thead><tbody>
<tr><td>Monochromatic</td><td>One hue in several values and chromas</td><td>Navy island, mid-blue tile, pale blue walls</td></tr>
<tr><td>Analogous</td><td>Two to four neighboring hues</td><td>Blue-green cabinets with green and yellow-green accents</td></tr>
<tr><td>Complementary</td><td>Hues opposite each other on the wheel</td><td>Blue cabinets with copper or orange-toned wood</td></tr>
<tr><td>Split-complementary</td><td>A hue plus the two hues beside its complement</td><td>Yellow-toned oak with red-violet and blue-violet accents</td></tr>
<tr><td>Triadic</td><td>Three hues evenly spaced on the wheel</td><td>Muted red, yellow and blue in a patterned tile</td></tr>
<tr><td>Neutral</td><td>Whites, grays and blacks, plus near-neutrals</td><td>White and gray with black hardware</td></tr>
</tbody></table>
<h3>Temperature and undertone</h3>
<p>Warm hues (reds, oranges, yellows) advance and energize; cool hues (blues, greens, violets) recede and calm. Every white, gray and beige also has an <b>undertone</b> of yellow, pink, green or blue. Undertone clashes are the most common color complaint in K&amp;B work, such as a warm white cabinet that looks dingy beside a cool white quartz. Compare neutrals side by side and against a pure white reference.</p>
<h3>Light reflectance value</h3>
<p>Light reflectance value (LRV) runs from 0 (black) to 100 (a perfect reflector). High-LRV finishes bounce light and make small or dark rooms feel brighter. LRV also matters for universal design: contrast between adjacent surfaces, such as a countertop edge against the cabinet below or a floor against a wall, helps people with low vision. A difference of about 30 LRV points is a commonly cited target.</p>
<h3>Light changes color</h3>
<p>Color temperature (warm 2700 K versus cool 4000 K) and color rendering quality shift how finishes look. <b>Metamerism</b> is when two samples match under one light source but not under another. View samples in the actual room, under the planned lighting, at different times of day.</p>
<aside class="tip"><p><b>Selection order.</b> Choose the least flexible, most variable materials first, usually natural stone slabs or statement tile, then cabinetry, then paint last. Paint can be mixed to any color; a slab can't.</p></aside>` },
{ id: `m2l4`, t: `Style vocabulary`, min: 20, h: `
<p>Clients describe what they want in style words, and those words mean different things to different people. Learn the common vocabulary, then always confirm with images.</p>
<table><thead><tr><th>Style</th><th>Character</th><th>Typical K&amp;B details</th></tr></thead><tbody>
<tr><td>Traditional</td><td>Symmetry, ornament, furniture-like detail</td><td>Raised-panel doors, crown molding, glazed finishes, marble, decorative hoods</td></tr>
<tr><td>Transitional</td><td>Traditional warmth with contemporary simplicity</td><td>Shaker doors, quartz, simple moldings, mixed metals</td></tr>
<tr><td>Contemporary</td><td>Of the moment, clean and current</td><td>Slab doors, integrated pulls, large-format tile, porcelain slabs</td></tr>
<tr><td>Modern</td><td>Function-driven, flat planes, little ornament</td><td>Flat wood-veneer doors, handleless fronts, strong horizontal lines</td></tr>
<tr><td>Mid-century modern</td><td>1945–1970 design, organic curves, warm wood</td><td>Walnut slab doors, tapered legs, terrazzo, globe lights</td></tr>
<tr><td>Farmhouse</td><td>Casual, practical, rustic</td><td>Apron-front sink, open shelves, shiplap, black hardware, butcher block</td></tr>
<tr><td>Arts and Crafts (Craftsman)</td><td>Handcraft, honest joinery, natural materials</td><td>Inset doors, quartersawn oak, handmade tile, bronze hardware</td></tr>
<tr><td>Industrial</td><td>Raw, utilitarian materials</td><td>Concrete, stainless steel, exposed brick, metal shelving</td></tr>
<tr><td>Scandinavian</td><td>Light, simple, functional</td><td>White oak or ash, matte whites, minimal hardware</td></tr>
<tr><td>Mediterranean (Old World)</td><td>Warm, textured, handmade</td><td>Plaster hoods, terra cotta, patterned tile, iron</td></tr>
<tr><td>Coastal</td><td>Light, airy, relaxed</td><td>Whites and blues, beadboard, natural textures</td></tr>
</tbody></table>
<h3>Using style words well</h3>
<ul>
<li>Ask clients to collect images, then ask what they like in each one: the color, the hardware, the light, the tile?</li>
<li>Summarize the direction in three to five words the client agrees with, such as "warm, simple, natural wood, soft black accents."</li>
<li>Kitchens and baths are replaced far less often than furniture, so trends date them quickly. Put trend elements where they're easy to change: paint, hardware, lighting and accessories.</li>
</ul>` }
],

COURSE.modules.push({
id: `m3`, n: 3, title: `Drafting & drawing fundamentals`,
sum: `How to produce clear, industry-standard kitchen and bath drawings: scale, line types, symbols, dimensioning, the drawing set, and quick perspective sketches. The lab is your first full floor plan and elevation.`,
obj: [`Read and draw at 1/2" = 1'-0" and convert between real and drawing sizes.`, `Apply line types and weights consistently.`, `Draw and interpret plan symbols for openings, fixtures and electrical items.`, `Dimension a plan in tiers and assemble a complete drawing set.`],
lessons: [
{ id: `m3l1`, t: `Tools, media & scale`, min: 25, h: `
<p>Drawings are the language of design and construction. Clients approve them, installers build from them, and fabricators and inspectors rely on them. Whether you draw by hand or in software, the conventions are the same.</p>
<h3>Tools</h3>
<p>Hand drafting uses a drafting board with a parallel bar or T-square, 45° and 30/60° triangles, an architect's scale, lead holders or mechanical pencils (harder leads such as 2H for light lines, HB or F for dark ones), an eraser and erasing shield, circle templates, kitchen and bath fixture templates at 1/2" scale, drafting tape, and vellum or tracing paper. Common industry software includes 20-20 Design, Chief Architect, SketchUp, AutoCAD and Revit, plus cabinet-manufacturing programs. Hand skills still matter: you'll sketch in client meetings, and knowing the conventions makes you a better CAD user.</p>
<h3>Scale</h3>
<p>A scale drawing shrinks everything by the same ratio. The K&amp;B standard is <b>1/2" = 1'-0"</b> for floor plans and elevations, a ratio of 1:24. Whole-house plans usually use 1/4" = 1'-0" (1:48). Metric drawings typically use 1:20 for kitchen and bath plans and 1:50 for larger plans. Details may be drawn at 1" = 1'-0" or larger.</p>
<table><thead><tr><th>Real size</th><th>At 1/2" = 1'-0"</th><th>At 1/4" = 1'-0"</th></tr></thead><tbody>
<tr><td>24" (base cabinet depth)</td><td>1"</td><td>1/2"</td></tr>
<tr><td>30" (range width)</td><td>1-1/4"</td><td>5/8"</td></tr>
<tr><td>36" (counter height)</td><td>1-1/2"</td><td>3/4"</td></tr>
<tr><td>10'-0"</td><td>5"</td><td>2-1/2"</td></tr>
<tr><td>15'-6"</td><td>7-3/4"</td><td>3-7/8"</td></tr>
</tbody></table>
<p>The math: at 1/2" = 1'-0", the drawing length in inches equals the real length in feet divided by 2, or the real length in inches divided by 24.</p>
<h3>Reading an architect's scale</h3>
<p>The triangular architect's scale carries eleven scales. Each edge holds two scales that read from opposite ends, and next to each zero is a subdivided unit representing one foot divided into inches. To measure 3'-4" at 1/2" = 1'-0", put the 3-foot mark at one end of the line and read the 4-inch mark in the subdivided foot on the far side of zero.</p>
<aside class="warn"><p><b>Never scale a drawing to build from it.</b> Prints shrink and stretch, and PDFs get resized. Written dimensions govern. If a dimension is missing, ask; don't measure the paper.</p></aside>
<p>On this course's drafting board, grid squares are 6" and heavier lines mark every foot, so a 12-foot wall spans 24 squares.</p>` },
{ id: `m3l2`, t: `Line types & line weights`, min: 25, h: `
<p>Line weight and line type tell the reader what they're looking at. A consistent hierarchy lets anyone tell a wall from a cabinet from an overhead soffit at a glance.</p>
<fig name="lineTypes">Standard line types. Heavier lines are for cut or important elements; thin lines are for dimensions and notes.</fig>
<h3>The floor plan cut</h3>
<p>A floor plan is a horizontal section: imagine slicing the room a few feet above the floor, commonly about 4 to 5 feet up, and looking down. Elements <b>cut</b> by that plane, mainly walls and tall cabinets, get the heaviest lines. Elements <b>below</b> the cut, such as base cabinets, counters and fixtures, get medium visible lines. Elements <b>above</b> the cut, such as wall cabinets, soffits, beams and hoods, are drawn with hidden (dashed) lines.</p>
<h3>A practical hierarchy</h3>
<table><thead><tr><th>Weight</th><th>Use</th></tr></thead><tbody>
<tr><td>Heaviest</td><td>Walls cut in plan (often filled solid or hatched, called poché) and sheet borders</td></tr>
<tr><td>Medium</td><td>Cabinets, counters, fixtures, appliances and door swings</td></tr>
<tr><td>Medium dashed</td><td>Wall cabinets, soffits and other overhead or hidden items</td></tr>
<tr><td>Thin</td><td>Dimension, extension and leader lines, centerlines, hatching and tile patterns</td></tr>
</tbody></table>
<h3>Lettering and notes</h3>
<p>Traditional hand lettering is uppercase, about 1/8" high for notes, written between light guidelines so every character is the same height. In CAD, set one or two text styles and stick to them. Keep notes short and specific, such as "Blocking for grab bar 33"–36" AFF," and make them read from the bottom or right side of the sheet.</p>
<aside class="tip"><p><b>Test your hierarchy.</b> Squint at the drawing. If you still see walls first, cabinets second and notes last, your line weights are working.</p></aside>` },
{ id: `m3l3`, t: `Plan symbols`, min: 30, h: `
<p>Symbols let a drawing say a lot in a small space. Most are standard across the industry, but conventions vary a little between firms and software, so every mechanical or lighting plan should carry a legend.</p>
<fig name="symbols">Common symbols for openings, devices and lighting. Always include a legend on the sheet.</fig>
<h3>Walls and openings</h3>
<ul>
<li><b>Walls</b> are two parallel lines at real thickness: roughly 4-1/2" for an interior 2x4 wall with drywall and 6" to 8" or more for exterior walls. Existing, new and to-be-removed walls use different fills or line types; say which in the legend.</li>
<li><b>Hinged doors</b> show the leaf at its open position and a quarter-circle swing arc. The swing tells you which way the door opens and where the hinges are, both critical for appliance and cabinet clearances.</li>
<li><b>Pocket, bifold and sliding doors</b> each have their own symbol. Pocket doors save swing space in small baths.</li>
<li><b>Windows</b> are drawn within the wall thickness with thin lines for glass and sill. Show casings, because cabinets and backsplashes must fit around them.</li>
</ul>
<h3>Fixtures and appliances</h3>
<p>Draw sinks, toilets, tubs, showers and appliances at real size from manufacturer specifications. Label appliances with standard abbreviations such as REF, DW, RANGE, CT (cooktop), OV (oven) and MW (microwave), or key them to a schedule.</p>
<h3>Electrical, lighting and mechanical</h3>
<p>The mechanical plan shows receptacles, switches, lighting, fans and dedicated appliance connections. A dashed arc called a <b>switch leg</b> connects each switch to the fixtures it controls. Note special requirements at the symbol, such as "GFCI," "240 V," "dedicated 20 A" or a height like "+44" AFF" (above finished floor).</p>
<h3>Reference symbols</h3>
<p>A north arrow orients the plan. Section and elevation markers are bubbles with an arrow showing the direction of view and a label linking to the drawing where that view appears, such as view A on sheet 3.</p>` },
{ id: `m3l4`, t: `Dimensioning`, min: 30, h: `
<p>A drawing is only as useful as its dimensions. Someone who has never seen the room should be able to lay out the whole job from your dimensions alone.</p>
<h3>Principles</h3>
<ul>
<li><b>Complete:</b> every wall, opening, fixture location and cabinet size is defined.</li>
<li><b>Clear:</b> dimension lines sit outside the plan where possible and don't cross needlessly.</li>
<li><b>Consistent:</b> NKBA-style drawings typically give dimensions in inches (144", not 12'-0"), or in millimeters on metric drawings. Whatever you choose, use it everywhere.</li>
<li><b>Checked:</b> every string of dimensions adds up to its overall.</li>
</ul>
<h3>What to dimension</h3>
<ul>
<li>Wall lengths, measured to finished surfaces in a remodel.</li>
<li>Windows and doors from the outside edge of casing to the outside edge of casing, plus heights (floor to bottom and top of casing) on elevations.</li>
<li>Centerlines of plumbing fixtures, appliances that need utilities, and windows that fixtures align with.</li>
<li>Ceiling height (a note such as CLG 96") and soffit heights and depths.</li>
<li>Cabinet widths, usually through cabinet codes and dimension strings on the elevations.</li>
</ul>
<h3>Dimensioning in tiers</h3>
<p>A clean convention stacks dimension strings in tiers outside each wall. The tier nearest the plan locates openings and breaks, the next tier locates centerlines, and the outermost tier gives the overall length. Every tier must total the overall.</p>
<fig name="dimTiers">Three tiers on one wall. Tier 1 (52" + 40" + 52") and tier 2 (72" + 72") both total the 144" overall.</fig>
<h3>Mechanics</h3>
<p>Extension lines start with a small gap from the object and run just past the dimension line. Dimension lines end in architectural ticks, arrows or dots; pick one style. Text sits above the line, centered, reading from the bottom or right of the sheet. Dimension to visible lines rather than hidden ones when you can, and don't repeat a dimension on several views unless clarity demands it.</p>
<aside class="warn"><p><b>Always add up the strings.</b> If a tier doesn't total the overall, either the drawing or the field measurements are wrong. Find out which before anything is ordered.</p></aside>` },
{ id: `m3l5`, t: `The drawing set & perspective sketching`, min: 30, h: `
<p>A complete K&amp;B presentation is a coordinated set of drawings, each doing one job. Together they let the client see the design, the installer build it and the inspector verify it.</p>
<table><thead><tr><th>Drawing</th><th>What it shows</th></tr></thead><tbody>
<tr><td>Floor plan</td><td>Walls, openings, cabinetry, appliances, fixtures, cabinet codes and dimensions</td></tr>
<tr><td>Construction plan</td><td>Walls to remain, be removed or be built; framing, door and window changes</td></tr>
<tr><td>Mechanical plan</td><td>Electrical devices, lighting, switching, plumbing locations, ventilation and HVAC, with a legend</td></tr>
<tr><td>Elevations</td><td>Each wall seen straight on, with cabinets, appliances, openings, heights and door swings</td></tr>
<tr><td>Countertop plan</td><td>Material, edge profiles, overhangs, seams, cutouts and backsplashes</td></tr>
<tr><td>Reflected ceiling plan</td><td>Ceiling lighting, soffits and ceiling changes, drawn as if reflected in a mirror on the floor</td></tr>
<tr><td>Sections and details</td><td>Cuts through special conditions, such as a raised bar, curbless shower or custom hood</td></tr>
<tr><td>Perspectives and renderings</td><td>What the finished room will look like</td></tr>
<tr><td>Specifications</td><td>Products, models, finishes, quantities, and who supplies and installs each item</td></tr>
</tbody></table>
<h3>Title block</h3>
<p>Every sheet carries a title block with the project and client name, address, designer and firm, drawing title, scale, date, sheet number (such as 2 of 6), a revision log, and a disclaimer that structural, mechanical and electrical work must be verified by licensed professionals and dimensions verified in the field.</p>
<h3>Elevation conventions</h3>
<p>Label each elevation to match the plan (Elevation A, B, C). Show finished floor, counter height, backsplash height, wall cabinet bottom and top, and ceiling. Door swing is shown with two dashed lines drawn from the corners on the handle side to a point at the middle of the hinge side, so the point of the V marks the hinges. Drawers are shown as horizontal divisions without swing lines.</p>
<h3>Quick perspective sketching</h3>
<p>A <b>one-point perspective</b> has a single vanishing point and works best looking straight at a wall, such as into a U-shaped kitchen or down the length of a bath. A <b>two-point perspective</b> looks into a corner, with two vanishing points on the horizon line. An <b>isometric</b> view isn't a true perspective: parallel lines stay parallel on 30° axes, which makes it easy to measure but less natural to the eye.</p>
<fig name="perspective">One-point perspective: draw the back wall to scale, set the horizon at eye level, then project every receding edge toward the vanishing point.</fig>
<ol>
<li>Draw the back wall to scale.</li>
<li>Draw the horizon line at eye level, about 60" above the floor for a standing viewer, and mark the vanishing point on it.</li>
<li>Draw lines from the vanishing point through each back-wall corner and extend them toward the viewer. These become the floor, ceiling and wall edges.</li>
<li>Locate counters, cabinets and openings on the back wall at their true heights, then project them forward along lines to the vanishing point.</li>
<li>Darken the final lines and erase the construction lines.</li>
</ol>` }
],

COURSE.modules.push({
id: `m4`, n: 4, title: `Measuring & site survey`,
sum: `Accurate field measurements and a thorough record of existing conditions are the foundation every plan and order depends on. This module covers the measuring routine, checking for square, plumb and level, and documenting structure, mechanicals and hazards.`,
obj: [`Measure a room systematically, including openings, heights and obstacles.`, `Check walls and corners for square, plumb and level.`, `Document structural, mechanical and hazardous-material conditions.`, `Produce a clean, verifiable field sketch and photo log.`],
lessons: [
{ id: `m4l1`, t: `Measuring the space`, min: 25, h: `
<p>A beautiful design built from a bad measurement is a costly failure. Cabinets arrive a half-inch too wide, a countertop doesn't clear a window casing, a refrigerator won't fit its opening. A disciplined routine prevents almost all of it.</p>
<h3>Tools</h3>
<p>Bring a 25- or 30-foot tape with 1/16" marks, a laser distance meter, a 4-foot level, a framing square, graph paper or a tablet, pencils, a phone camera, a flashlight, a stud finder and a receptacle tester.</p>
<h3>The routine</h3>
<ol>
<li><b>Sketch first.</b> Walk the space and draw the room large on graph paper, not to scale, with every wall, opening and obstacle. Label the walls A, B, C, D clockwise.</li>
<li><b>Measure each wall at several heights:</b> just above the baseboard, at counter height (about 36"), and near the ceiling. Walls are rarely plumb or flat. Record the smallest dimension, because cabinets must fit at the tightest point, and note the variation.</li>
<li><b>Take running dimensions.</b> Hook the tape at one corner and read cumulative distances to every feature along the wall: casing edges, plumbing centerlines, receptacles. Running dimensions avoid the error that builds up when you add many separate short measurements.</li>
<li><b>Openings:</b> width from the outside edge of casing to the outside edge of casing; height from the floor to the bottom of the casing (and to the sill or stool) and to the top of the casing. Note casing thickness and how far the stool projects.</li>
<li><b>Doors:</b> width including casings, hinge side, swing direction, and what the door swings into.</li>
<li><b>Ceilings:</b> height at several points; soffit and bulkhead heights, depths and lengths; beams and slopes.</li>
<li><b>Utilities:</b> sink drain and supply centerlines and heights, gas line, vents and registers, radiators, receptacles and switches (centerline and height), and the locations of the electrical panel and water heater.</li>
<li><b>Check square</b> with the 3-4-5 method, scaled up for accuracy: measure 36" along one wall and 48" along the other from the corner. A square corner has a 60" diagonal between those marks.</li>
<li><b>Check level and plumb:</b> run the level along the floor where cabinets will go (installers start from the high point) and hold it on walls.</li>
<li><b>Photograph</b> every wall, corner, the ceiling, the floor, under the sink and the mechanical areas, with the tape visible in key shots.</li>
<li><b>Verify:</b> each wall's segments must add up to its overall. If they don't, measure again before you leave.</li>
</ol>
<fig name="fieldMeasure">A field sketch with running dimensions along wall A, notes at three heights on wall B, heights noted as AFF (above finished floor), and a 36-48-60 square check that found the corner out by 1/8".</fig>
<aside class="tip"><p><b>Measure in inches.</b> Record 146-1/4" rather than 12'-2-1/4". It removes a conversion step and is how NKBA-style drawings are dimensioned anyway.</p></aside>
<h3>Reading a square check</h3>
<p>If the diagonal is longer than 60", the corner is more than 90°; shorter means less than 90°. Small errors matter most for countertops, which are rigid and templated to the walls, and for long cabinet runs meeting in a corner. Note the direction and amount so the installer can plan scribes and fillers.</p>` },
{ id: `m4l2`, t: `Documenting existing conditions`, min: 20, h: `
<p>Dimensions tell you what fits. Existing conditions tell you what it will cost and what might go wrong. Record them at the first site visit so surprises show up in your estimate, not in the middle of demolition.</p>
<h3>Structure</h3>
<ul>
<li>Which walls might be load-bearing: exterior walls, walls perpendicular to floor joists or rafters above, walls over beams or over walls on the floor below. Only a qualified professional can confirm.</li>
<li>Joist direction and depth, which control whether a drain or duct can run where you want it.</li>
<li>Attic and basement or crawlspace access, and which walls are exterior (for venting a range hood or bath fan).</li>
<li>Floor condition: level, springy or damaged subfloor, and height changes at doorways. Tile needs a stiff floor.</li>
</ul>
<h3>Mechanical systems</h3>
<ul>
<li><b>Electrical:</b> panel size (for example 100, 150 or 200 amps) and open breaker spaces. Induction cooktops, electric ranges and ovens need large dedicated circuits. Note outdated wiring such as knob-and-tube.</li>
<li><b>Plumbing:</b> pipe materials (copper, PEX, CPVC, galvanized steel, polybutylene, cast-iron drains), water pressure, fixture shutoffs, and water heater capacity. A large soaking tub may need a bigger water heater.</li>
<li><b>Gas:</b> supply location and whether it can serve a larger range.</li>
<li><b>HVAC:</b> registers, returns, radiators and baseboard heat that cabinets would cover.</li>
</ul>
<h3>Hazards</h3>
<ul>
<li><b>Lead paint:</b> in the U.S., work that disturbs painted surfaces in homes built before 1978 falls under the EPA Renovation, Repair and Painting (RRP) Rule, which requires certified firms and lead-safe work practices.</li>
<li><b>Asbestos:</b> older materials such as some vinyl flooring and adhesives, textured ceilings, joint compound and pipe insulation may contain it. Test before demolition.</li>
<li><b>Moisture and mold:</b> check under sinks, around toilets and tubs, and at exterior walls. Soft floors near fixtures usually mean hidden damage.</li>
</ul>
<h3>Site logistics</h3>
<p>Measure the delivery path: doors, stairs, hallway turns and elevators for refrigerators and large stone slabs. Ask about parking, staging, HOA or condo rules (work hours, elevator reservations, required sound underlayment for floors) and permits.</p>
<aside class="tip"><p><b>End every visit with a question list.</b> Write down what you couldn't verify, such as joist direction or panel capacity, and who will answer it. Unresolved questions belong in the estimate as allowances or exclusions.</p></aside>` }
],
