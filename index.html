(function(){'use strict';
const C = window.COURSE, FIGS = window.FIGS, MODS = C.modules, STUDY = 15;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const main = document.getElementById('main');

/* ---------- storage: account (db) when available, browser otherwise ---------- */
const Store = (() => {
  const mem = {}, stamp = {}, timers = {}, busy = {}, again = {};
  let db = null, uid = null, remote = false, mode = 'local', onMode = () => {};
  const K = k => 'kbd40:' + k;
  function load(k) {
    if (!mem[k]) {
      let o = null;
      try { const raw = localStorage.getItem(K(k)); if (raw) o = JSON.parse(raw); } catch (e) { o = null; }
      mem[k] = (o && o.d && typeof o.d === 'object') ? o.d : {};
      stamp[k] = (o && o.t) || 0;
    }
    return mem[k];
  }
  function local(k) { try { localStorage.setItem(K(k), JSON.stringify({ t: stamp[k], d: mem[k] })); } catch (e) { /* storage unavailable */ } }
  function setMode(m) { mode = m; onMode(m); }
  function save(k) { load(k); stamp[k] = Date.now(); local(k); if (remote) { clearTimeout(timers[k]); timers[k] = setTimeout(() => push(k), 1200); } }
  async function push(k) {
    if (!remote) return;
    if (busy[k]) { again[k] = true; return; }
    busy[k] = true;
    try { await db.doc('data/users/' + uid + '/' + k).set({ t: stamp[k], d: mem[k] }); if (mode !== 'account') setMode('account'); }
    catch (e) {
      const c = e && e.code;
      if (c === 'unavailable') setTimeout(() => push(k), 2000 + Math.random() * 2000);
      else if (c === 'quota_exceeded' || c === 'resource_exhausted') setMode('full');
      else { remote = false; setMode('local'); }
    } finally { busy[k] = false; if (again[k]) { again[k] = false; push(k); } }
  }
  function replace(k, d) { const m = load(k); Object.keys(m).forEach(x => { delete m[x]; }); Object.assign(m, JSON.parse(JSON.stringify(d || {}))); }
  async function pull(k) {
    load(k);
    if (!remote) return false;
    try {
      const snap = await db.doc('data/users/' + uid + '/' + k).get();
      if (snap.exists) {
        const b = snap.data() || {}, t = b.t || 0;
        if (t > stamp[k]) { replace(k, b.d); stamp[k] = t; local(k); return true; }
        if (stamp[k] > t) push(k);
      } else if (stamp[k] > 0) push(k);
    } catch (e) { /* keep local copy */ }
    return false;
  }
  async function connect(keys) {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') { setMode('local'); return false; }
      const [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!d || !u) { setMode('local'); return false; }
      const id = await u.id();
      if (!id) { setMode('local'); return false; }
      db = d; uid = id; remote = true; setMode('account');
      let changed = false;
      for (const k of keys) { if (await pull(k)) changed = true; }
      return changed;
    } catch (e) { setMode('local'); return false; }
  }
  return { load, save, pull, connect, get mode() { return mode; }, setOnMode(f) { onMode = f; } };
})();

const P = () => Store.load('progress');
const NT = () => Store.load('notes');
const sec = n => { const p = P(); if (!p[n] || typeof p[n] !== 'object') p[n] = {}; return p[n]; };
const saveP = () => Store.save('progress');

/* ---------- progress and hours ---------- */
const lessonDone = l => !!sec('lessons')[l.id];
const labDone = m => !!sec('labs')[m.id];
const quizRec = m => sec('quiz')[m.id];
const quizPassed = m => !!(quizRec(m) && quizRec(m).passed);
const reviewDone = m => { const r = sec('review')[m.id] || []; return m.review.every((_, i) => r[i]); };
const cardsDone = m => { const c = sec('cards')[m.id] || {}; return m.terms.every((_, i) => c[i]); };
const modItems = m => [...m.lessons.map(lessonDone), labDone(m), reviewDone(m), cardsDone(m), quizPassed(m)];
const modMinutes = m => m.lessons.reduce((a, l) => a + l.min, 0) + m.lab.min + 3 * STUDY;
function modDoneMin(m) {
  let t = 0;
  m.lessons.forEach(l => { if (lessonDone(l)) t += l.min; });
  if (labDone(m)) t += m.lab.min;
  if (reviewDone(m)) t += STUDY;
  if (cardsDone(m)) t += STUDY;
  if (quizPassed(m)) t += STUDY;
  return t;
}
const testRec = id => sec('tests')[id];
const testPassed = id => !!(testRec(id) && testRec(id).passed);
const capDone = () => !!sec('cap').done;
const TOTAL = MODS.reduce((a, m) => a + modMinutes(m), 0) + C.midterm.min + C.capstone.min + C.final.min;
function doneMin() {
  let t = MODS.reduce((a, m) => a + modDoneMin(m), 0);
  if (testPassed('midterm')) t += C.midterm.min;
  if (capDone()) t += C.capstone.min;
  if (testPassed('final')) t += C.final.min;
  return t;
}
const fmtH = min => String(Math.round(min / 6) / 10);

function scaleBar(done) {
  const H = Math.round(TOTAL / 60), W = 520, x0 = 10, cw = (W - 20) / H, dh = done / 60;
  let s = '';
  for (let i = 0; i < H; i++) {
    const x = (x0 + i * cw).toFixed(1);
    s += `<rect x="${x}" y="6" width="${cw.toFixed(1)}" height="12" class="${i % 2 ? 'sb-a' : 'sb-b'}"/>`;
    if (i < dh) s += `<rect x="${x}" y="6" width="${(cw * Math.min(1, dh - i)).toFixed(1)}" height="12" class="sb-e"/>`;
  }
  for (let t = 0; t <= H; t += 10) s += `<text x="${(x0 + t * cw).toFixed(1)}" y="34" text-anchor="${t === 0 ? 'start' : t === H ? 'end' : 'middle'}">${t === H ? t + ' h' : t}</text>`;
  return `<svg viewBox="0 0 ${W} 40" role="img" aria-label="${fmtH(done)} of ${H} hours complete">${s}</svg>`;
}

/* ---------- navigation ---------- */
let currentId = '';
const doneMark = '<span class="st done"><span aria-hidden="true">✓</span><span class="sr"> complete</span></span>';
const testSt = id => { const r = testRec(id); return r && r.passed ? doneMark : r ? `<span class="st">${r.best}%</span>` : ''; };
function navHTML(cur) {
  const a = (href, n, t, st, id) => `<a href="${href}"${cur === id ? ' aria-current="page"' : ''}><span class="n">${n}</span><span>${esc(t)}</span>${st}</a>`;
  const stMod = m => { const it = modItems(m), d = it.filter(Boolean).length; return d === it.length ? doneMark : `<span class="st">${d}/${it.length}</span>`; };
  let h = a('#/', '', 'Course home', '', 'home') + '<h2>Course plan</h2>';
  MODS.forEach(m => { h += a('#/m/' + m.n, m.n, m.title, stMod(m), m.id); if (m.n === C.midterm.after) h += a('#/test/midterm', '', C.midterm.title, testSt('midterm'), 'midterm'); });
  h += a('#/capstone', '', C.capstone.title, capDone() ? doneMark : '', 'capstone') + a('#/test/final', '', C.final.title, testSt('final'), 'final');
  h += '<h2>Study tools</h2>' + a('#/cards', '', 'Flashcards', '', 'cards') + a('#/glossary', '', 'Glossary', '', 'glossary') + a('#/reference', '', 'Quick reference', '', 'reference') + a('#/tools', '', 'Calculators', '', 'tools') + a('#/board/free', '', 'Drafting board', '', 'board');
  return h;
}
function renderNav(id) {
  if (id != null) currentId = id;
  $('#nav').innerHTML = navHTML(currentId);
  const d = doneMin();
  $('#sideHrs').innerHTML = `<div class="meter" aria-hidden="true"><i style="width:${Math.min(100, d / TOTAL * 100).toFixed(1)}%"></i></div><p><b>${fmtH(d)}</b> of ${fmtH(TOTAL)} hours complete</p>`;
}
function openSide() { $('#side').classList.add('open'); $('#scrim').classList.add('on'); $('#menuBtn').setAttribute('aria-expanded', 'true'); }
function closeSide() { $('#side').classList.remove('open'); $('#scrim').classList.remove('on'); $('#menuBtn').setAttribute('aria-expanded', 'false'); }

/* ---------- shared view helpers ---------- */
const tblock = cells => `<div class="tblock">${cells.map(([k, v]) => `<div><small>${esc(k)}</small><span>${v}</span></div>`).join('')}</div>`;
function fig(n, cap) {
  const f = FIGS[n]; if (!f) return '';
  let s = ''; try { s = f(); } catch (e) { console.error('Figure failed', n, e); }
  return `<figure class="fg"><div class="fgb">${s}</div>${cap ? `<figcaption>${cap}</figcaption>` : ''}</figure>`;
}

function nextUp() {
  for (const m of MODS) {

function viewCards(m) {
  const deck = m ? m.terms.map((t, i) => ({ t, mid: m.id, mn: m.n, i })) : MODS.flatMap(mm => mm.terms.map((t, i) => ({ t, mid: mm.id, mn: mm.n, i })));

<div class="cardmeta"><span id="cpos"></span><span id="ccnt"></span></div>
<div class="cardwrap"><button class="fcard" id="fc"><div class="face"><span class="hint" id="fhint1"></span><div class="term" id="fterm"></div></div><div class="face back"><span class="hint" id="fhint2"></span><div class="def" id="fdef"></div></div></button></div>
<div class="row"><button class="btn ghost" id="cprev">Previous</button><button class="btn" id="clearn">Still learning</button><button class="btn pri" id="cknow">I know this</button><button class="btn ghost" id="cnext">Next</button></div>
<div class="row" style="margin-top:14px"><button class="btn ghost" id="cshuf">Shuffle</button><label class="row" style="gap:8px"><input type="checkbox" id="conly"> Only cards I'm still learning</label></div>
${m ? `<div class="bar"><a class="btn ghost" href="#/m/${m.n}">Module overview</a><a class="btn pri" href="#/m/${m.n}/quiz">Next: module quiz</a></div>` : ''}`,
  after() {
    const cs = sec('cards');
    const st = c => (cs[c.mid] || {})[c.i];
    let order = deck.map((_, i) => i), pos = 0, only = false;
    const list = () => only ? order.filter(i => st(deck[i]) === 'r') : order;
    const fc = $('#fc');
    function paint() {
      const L = list();
      const known = deck.filter(c => st(c) === 'k').length, learn = deck.filter(c => st(c) === 'r').length;
      $('#ccnt').textContent = `Known ${known}, still learning ${learn}, unmarked ${deck.length - known - learn}`;
      fc.classList.remove('flip');
      if (!L.length) { $('#cpos').textContent = 'No cards are marked still learning.'; $('#fterm').textContent = 'All clear'; $('#fdef').textContent = 'Turn off the filter to review every card.'; $('#fhint1').textContent = ''; $('#fhint2').textContent = ''; return; }
      if (pos >= L.length) pos = 0;
      const c = deck[L[pos]];
      $('#cpos').textContent = `Card ${pos + 1} of ${L.length}`;
      $('#fterm').textContent = c.t[0]; $('#fdef').textContent = c.t[1];
      $('#fhint1').textContent = (m ? '' : `Module ${c.mn} `) + (st(c) === 'k' ? 'Known' : st(c) === 'r' ? 'Still learning' : 'Term');
      $('#fhint2').textContent = c.t[0];
      fc.setAttribute('aria-label', `Flashcard: ${c.t[0]}. Select to flip.`);
      if (m) $('#lst').innerHTML = statusTxt(cardsDone(m));
    }
    function mark(v) {
      const L = list(); if (!L.length) return;
      const c = deck[L[pos]]; if (!cs[c.mid] || typeof cs[c.mid] !== 'object') cs[c.mid] = {};
      cs[c.mid][c.i] = v; saveP(); renderNav();
      if (!(only && v === 'k')) pos = (pos + 1) % Math.max(1, list().length);
      paint();
    }
    fc.addEventListener('click', () => fc.classList.toggle('flip'));
    $('#cnext').addEventListener('click', () => { const n = list().length || 1; pos = (pos + 1) % n; paint(); });

    $('#cknow').addEventListener('click', () => mark('k'));

    $('#cshuf').addEventListener('click', () => { order = shuffle(order); pos = 0; paint(); });

    document.addEventListener('keydown', key);

    return () => document.removeEventListener('keydown', key);
  } };
}
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

/* ---------- quiz and test engine ---------- */
const RUNS = {};
const LET = 'ABCD';
const isTF = q => q.o.length === 2 && q.o[0] === 'True';
const qFig = q => q.f && FIGS[q.f] ? `<div class="qfig"><div class="fgb">${FIGS[q.f]()}</div></div>` : '';
function makeRun(key, qs, exam, minutes) {
  return { key, exam, i: 0, start: Date.now(), deadline: minutes ? Date.now() + minutes * 60000 : 0, done: false,
    items: qs.map(q => ({ q, order: isTF(q) ? q.o.map((_, i) => i) : shuffle(q.o.map((_, i) => i)), pick: null })) };
}
function mountRun(root, run, ctx) {

    const left = Math.max(0, run.deadline - Date.now()), el = $('#timer', root);
    if (el) { const s = Math.ceil(left / 1000); el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} left`; el.classList.toggle('low', left < 5 * 60000); }
    if (left <= 0) { clearInterval(tick); finish(true); }
  };
  function finish(timedOut) {
    clearInterval(tick);
    run.done = true;
    const n = run.items.length, correct = run.items.filter(x => x.pick === x.q.a).length, pct = Math.round(correct / n * 100), passed = pct >= ctx.pass;
    ctx.save(pct, passed); renderNav();
    const mins = Math.max(1, Math.round((Date.now() - run.start) / 60000));
    root.innerHTML = `${timedOut ? '<div class="note">Time is up, so your answers were submitted automatically.</div>' : ''}
<div class="result"><div class="score">${pct}%</div><div><span class="stamp ${passed ? 'pass' : 'fail'}">${passed ? 'Passed' : 'Not yet'}</span><p class="muted" style="margin:10px 0 0">${correct} of ${n} correct in about ${mins} min. Passing is ${ctx.pass}%.</p></div></div>
<div class="row"><button class="btn pri" id="again">Take it again</button><a class="btn" href="${ctx.back}">${esc(ctx.backLabel)}</a><label class="row" style="gap:8px"><input type="checkbox" id="missedOnly"${pct < 100 ? ' checked' : ''}> Show only questions I missed</label></div>
<h2 class="sec">Answer review</h2><ol class="revlist" id="revlist"></ol>`;
    const list = () => {
      const only = $('#missedOnly', root).checked;
      $('#revlist', root).innerHTML = run.items.map((x, k) => {
        const ok = x.pick === x.q.a; if (only && ok) return '';
        return `<li><p class="q"><b>${k + 1}.</b> ${esc(x.q.q)}</p>${qFig(x.q)}<p class="a ${ok ? 'ok' : 'no'}">Your answer: ${x.pick == null ? 'No answer' : esc(x.q.o[x.pick])}</p>${ok ? '' : `<p class="a ok">Correct answer: ${esc(x.q.o[x.q.a])}</p>`}<p class="e">${esc(x.q.e)}</p></li>`;
      }).join('') || '<li><p class="q">Every answer was correct.</p></li>';
    };
    list();
    $('#missedOnly', root).addEventListener('change', list);
    $('#again', root).addEventListener('click', ctx.restart);
    root.scrollIntoView({ block: 'start' });
  }
  function practice() {
    const it = run.items[run.i], q = it.q, n = run.items.length, answered = it.pick != null;
    const score = run.items.filter(x => x.pick != null && x.pick === x.q.a).length;
    root.innerHTML = `<div class="qhead"><span>Question ${run.i + 1} of ${n}</span><span>${score} correct so far</span></div>
<p class="qtext">${esc(q.q)}</p>${qFig(q)}
<div class="opts" role="group" aria-label="Answer choices">${it.order.map((oi, j) => { let c = 'opt'; if (answered) { if (oi === q.a) c += ' ok'; else if (oi === it.pick) c += ' no'; } return `<button class="${c}" data-o="${oi}"${answered ? ' disabled' : ''}><span class="l">${LET[j]}</span><span class="tx">${esc(q.o[oi])}</span></button>`; }).join('')}</div>
<div aria-live="polite">${answered ? `<div class="fb ${it.pick === q.a ? 'ok' : 'no'}"><b>${it.pick === q.a ? 'Correct.' : 'Not quite.'}</b> ${esc(q.e)}</div>` : ''}</div>
<div class="row" style="margin-top:16px">${answered ? `<button class="btn pri" id="nextQ">${run.i + 1 < n ? 'Next question' : 'See results'}</button>` : ''}</div>`;
    $$('.opt', root).forEach(b => b.addEventListener('click', () => { if (it.pick != null) return; it.pick = +b.dataset.o; practice(); const nb = $('#nextQ', root); if (nb) nb.focus(); }));

  }
  function exam() {
    const it = run.items[run.i], q = it.q, n = run.items.length, answered = run.items.filter(x => x.pick != null).length;
    root.innerHTML = `<div class="qhead"><span>Question ${run.i + 1} of ${n}</span><span class="timer" id="timer" aria-live="off"></span></div>
<p class="qtext">${esc(q.q)}</p>${qFig(q)}
<div class="opts" role="group" aria-label="Answer choices">${it.order.map((oi, j) => `<button class="opt" data-o="${oi}" aria-pressed="${it.pick === oi}"><span class="l">${LET[j]}</span><span class="tx">${esc(q.o[oi])}</span></button>`).join('')}</div>
<div class="row" style="margin-top:16px"><button class="btn" id="prevQ"${run.i === 0 ? ' disabled' : ''}>Previous</button><button class="btn pri" id="nextQ">${run.i + 1 < n ? 'Next' : 'Finish'}</button></div>
<div class="palette" aria-label="Jump to a question">${run.items.map((x, k) => `<button class="${x.pick != null ? 'ans' : ''}${k === run.i ? ' cur' : ''}" data-j="${k}" aria-label="Question ${k + 1}${x.pick != null ? ', answered' : ''}">${k + 1}</button>`).join('')}</div>
<p class="muted">${answered} of ${n} answered. Answers are revealed after you submit.</p>
<div class="row"><button class="btn ghost" id="submitQ">Submit test</button></div><div id="confirm" aria-live="polite"></div>`;
    clock();
    $$('.opt', root).forEach(b => b.addEventListener('click', () => { it.pick = +b.dataset.o; exam(); const sel = $(`.opt[data-o="${it.pick}"]`, root); if (sel) sel.focus(); }));
    $('#prevQ', root).addEventListener('click', () => { if (run.i > 0) { run.i--; exam(); } });
    $('#nextQ', root).addEventListener('click', () => { if (run.i + 1 < n) { run.i++; exam(); } else ask(); });
    $$('.palette button', root).forEach(b => b.addEventListener('click', () => { run.i = +b.dataset.j; exam(); }));
    $('#submitQ', root).addEventListener('click', ask);
    function ask() {
      const left = run.items.filter(x => x.pick == null).length;
      if (!left) { finish(false); return; }
      $('#confirm', root).innerHTML = `<div class="note">${left} question${left === 1 ? ' is' : 's are'} unanswered and will be marked wrong. <div class="row" style="margin-top:10px"><button class="btn pri" id="subYes">Submit anyway</button><button class="btn ghost" id="subNo">Keep working</button></div></div>`;
      $('#subYes', root).addEventListener('click', () => finish(false));
      $('#subNo', root).addEventListener('click', () => { $('#confirm', root).innerHTML = ''; });
    }
  }
  if (run.exam) { exam(); tick = setInterval(clock, 1000); } else practice();
  return () => clearInterval(tick);
}

function buildTest(id) {
  const T = C[id], qs = [];
  if (id === 'midterm') T.from.forEach(mid => { const m = MODS.find(x => x.id === mid); qs.push(...shuffle(m.quiz).slice(0, T.per)); });
  else MODS.forEach(m => qs.push(...shuffle(m.quiz).slice(0, T.per)));
  qs.push(...T.extra);
  if (T.n && qs.length < T.n) qs.push(...shuffle(C.midterm.extra).slice(0, T.n - qs.length));
  return shuffle(qs);
}
function viewTest(id) {
  const T = C[id], key = 'test:' + id;
  const count = id === 'midterm' ? T.from.length * T.per + T.extra.length : T.n;
  return { id, title: T.title, html: `
${tblock([['Test', esc(T.title)], ['Questions', count], ['Time limit', T.time + ' min'], ['To pass', T.pass + '%']])}
<h1 class="pt">${esc(T.title)}</h1><div id="qroot" class="qwrap"></div>`,
  after() {
    const root = $('#qroot'); let stop = null;
    const ctx = { pass: T.pass, back: '#/', backLabel: 'Course home',
      save(pct, passed) { const s = sec('tests'), r = s[id] || { best: 0, attempts: 0, passed: false }; r.attempts++; r.best = Math.max(r.best, pct); r.passed = r.passed || passed; r.last = pct; s[id] = r; saveP(); },
      restart() { intro(); } };
    function start() { if (stop) stop(); RUNS[key] = makeRun(key, buildTest(id), true, T.time); stop = mountRun(root, RUNS[key], ctx); }
    function intro() {
      if (stop) { stop(); stop = null; }
      const r = testRec(id);
      root.innerHTML = `<p class="lede">${esc(T.desc)}</p>${r ? `<p>Best score <b>${r.best}%</b> after ${r.attempts} attempt${r.attempts === 1 ? '' : 's'}${r.passed ? ', passed' : ''}. Each attempt draws a new mix of questions.</p>` : ''}<div class="note">The timer starts when you begin. You can move between questions and change answers until you submit. If you leave this page, the timer keeps running.</div><div class="row"><button class="btn pri" id="startT">Begin the ${id === 'midterm' ? 'midterm' : 'final exam'}</button><a class="btn ghost" href="#/reference">Review the quick reference first</a></div>`;
      $('#startT').addEventListener('click', start);

}

const ftin = v => { let f = Math.floor(v / 12), i = Math.round(v - f * 12); if (i === 12) { f++; i = 0; } return `${f}'-${i}"`; };
function frac16(x) {
  const n = Math.round(x * 16), w = Math.floor(n / 16); let r = n % 16, d = 16;
  while (r && r % 2 === 0) { r /= 2; d /= 2; }
  return r ? (w ? `${w}-${r}/${d}"` : `${r}/${d}"`) : `${w}"`;
}

      },
      oFan() {

        const need = a <= 100 ? Math.max(50, Math.ceil(a)) : Math.max(50, fx);
        return `<div>Area: <b>${Math.round(a * 10) / 10} sq ft</b></div><div>${a <= 100 ? `Area method (up to 100 sq ft): <b>${Math.max(50, Math.ceil(a))} CFM</b>` : `Fixture method (over 100 sq ft): <b>${fx} CFM</b>`}</div><div>Recommended fan: at least <b>${need} CFM</b>. Code minimum is 50 CFM intermittent or 20 continuous.</div>`;

        const d = real / +s;

      },
      oSto() {

      },
      oRec() {
        const L = v('rL'), n = L < 12 ? 0 : Math.ceil(L / 48);
        return L < 12 ? '<div>Spaces under 12" wide don\'t require a receptacle.</div>' : `<div>Minimum receptacles: <b>${n}</b></div><div>Each one covers 24" in each direction, so they can be up to 48" apart and no more than 24" from either end.</div>`;
      }
    };
    const run = () => Object.keys(calcs).forEach(k => { const el = $('#' + k); if (el) el.innerHTML = calcs[k](); });
    $$('.calc input, .calc select').forEach(el => el.addEventListener('input', run));

  } };

  const SIZES = { s: [192, 144], m: [288, 216], l: [384, 288] };
  const cv = $('#cv'), ctx = cv.getContext('2d');
  const COL = { ink: '--ink', blue: '--blue', red: '--red' }, LW = { 1: 1, 2: 1.8, 3: 3.2 };
  let tool = 'line', ortho = true, drag = null, preview = null, sc = 1, W = SIZES[S.size] || SIZES.m, hist = [], clearArm = null;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const r1 = x => Math.round(x * 10) / 10;
  const msg = t => { $('#bmsg').textContent = t; };
  $('#bsize').value = S.size;

  function size() {
    W = SIZES[S.size] || SIZES.m;
    const w = cv.clientWidth || 800, h = Math.round(w * W[1] / W[0]), dpr = window.devicePixelRatio || 1;
    cv.style.height = h + 'px';
    const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
    if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
    sc = w / W[0]; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function stroke(it) { ctx.strokeStyle = css(COL[it.c] || '--ink'); ctx.lineWidth = LW[it.w] || 1.8; ctx.setLineDash(it.st === 'h' ? [7, 5] : it.st === 'c' ? [16, 4, 3, 4] : []); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
  function drawItem(it) {
    ctx.save();
    if (it.t === 'line') { stroke(it); ctx.beginPath(); ctx.moveTo(it.a[0] * sc, it.a[1] * sc); ctx.lineTo(it.a[2] * sc, it.a[3] * sc); ctx.stroke(); }
    else if (it.t === 'rect') { stroke(it); ctx.strokeRect(it.a[0] * sc, it.a[1] * sc, it.a[2] * sc, it.a[3] * sc); }
    else if (it.t === 'pen') { stroke(it); ctx.setLineDash([]); ctx.beginPath(); for (let k = 0; k < it.p.length; k += 2) { const X = it.p[k] * sc, Y = it.p[k + 1] * sc; if (k) ctx.lineTo(X, Y); else ctx.moveTo(X, Y); } ctx.stroke(); }
    else if (it.t === 'text') { ctx.fillStyle = css(COL[it.c] || '--ink'); ctx.font = `600 13px ${css('--sans')}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(it.s, it.a[0] * sc, it.a[1] * sc); }
    else if (it.t === 'dim') {
      const [x1, y1, x2, y2] = it.a.map(q => q * sc), len = Math.hypot(it.a[2] - it.a[0], it.a[3] - it.a[1]);
      ctx.strokeStyle = css(COL[it.c] || '--ink'); ctx.fillStyle = ctx.strokeStyle; ctx.lineWidth = 1; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.lineWidth = 1.6; [[x1, y1], [x2, y2]].forEach(([x, y]) => { ctx.beginPath(); ctx.moveTo(x - 4, y + 4); ctx.lineTo(x + 4, y - 4); ctx.stroke(); });
      let ang = Math.atan2(y2 - y1, x2 - x1); if (ang > Math.PI / 2 || ang <= -Math.PI / 2) ang += Math.PI;
      ctx.translate((x1 + x2) / 2, (y1 + y2) / 2); ctx.rotate(ang); ctx.font = `600 12px ${css('--sans')}`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      const r = Math.round(len * 2) / 2; ctx.fillText((r % 1 ? r.toFixed(1) : r) + '"', 0, -4);
    }
    ctx.restore();
  }
  function draw() {
    size();
    const w = W[0] * sc, h = W[1] * sc;
    ctx.setLineDash([]);
    ctx.fillStyle = css('--sheet'); ctx.fillRect(0, 0, w, h);
    const g1 = css('--grid'), g2 = css('--grid2');
    for (let x = 0; x <= W[0]; x += 6) { ctx.strokeStyle = x % 12 ? g1 : g2; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(Math.round(x * sc) + .5, 0); ctx.lineTo(Math.round(x * sc) + .5, h); ctx.stroke(); }
    for (let y = 0; y <= W[1]; y += 6) { ctx.strokeStyle = y % 12 ? g1 : g2; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, Math.round(y * sc) + .5); ctx.lineTo(w, Math.round(y * sc) + .5); ctx.stroke(); }
    ctx.fillStyle = css('--stone'); ctx.font = `500 10px ${css('--sans')}`; ctx.textBaseline = 'alphabetic';
    for (let x = 24; x < W[0]; x += 24) ctx.fillText(x / 12 + "'", x * sc + 3, 11);
    for (let y = 24; y < W[1]; y += 24) ctx.fillText(y / 12 + "'", 3, y * sc - 3);
    S.items.forEach(drawItem);
    if (preview) drawItem(preview);
  }
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / sc, y: (e.clientY - r.top) / sc }; };
  const snap = p => { const s = +$('#bsnap').value; return { x: Math.max(0, Math.min(W[0], Math.round(p.x / s) * s)), y: Math.max(0, Math.min(W[1], Math.round(p.y / s) * s)) }; };
  const orth = (a, b) => !ortho ? b : Math.abs(b.x - a.x) >= Math.abs(b.y - a.y) ? { x: b.x, y: a.y } : { x: a.x, y: b.y };
  function mk() {
    if (!drag) return null;
    const a = drag.a, b = drag.b, w = +$('#bw').value, st = $('#bs').value, c = $('#bc').value;
    if (tool === 'line') return { t: 'line', a: [a.x, a.y, b.x, b.y], w, st, c };
    if (tool === 'dim') return { t: 'dim', a: [a.x, a.y, b.x, b.y], c };
    if (tool === 'rect') return { t: 'rect', a: [Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y)], w, st, c };
    if (tool === 'pen') return { t: 'pen', p: drag.pts.slice(), w, st: 's', c };
    return null;
  }
  const valid = it => it && (it.t === 'pen' ? it.p.length >= 4 : it.t === 'rect' ? it.a[2] > 0 && it.a[3] > 0 : (it.a[0] !== it.a[2] || it.a[1] !== it.a[3]));
  function save() {
    Store.save(key);
    const size = JSON.stringify(S).length;
    if (size > 200000) msg('This sheet is getting large. Start another sheet if saving stops working.');
  }
  function add(it) { S.items.push(it); hist.push({ op: 'add' }); save(); draw(); }
  function dSeg(p, x1, y1, x2, y2) { const dx = x2 - x1, dy = y2 - y1, L = dx * dx + dy * dy; let t = L ? ((p.x - x1) * dx + (p.y - y1) * dy) / L : 0; t = Math.max(0, Math.min(1, t)); return Math.hypot(p.x - (x1 + t * dx), p.y - (y1 + t * dy)); }
  function dist(it, p) {
    if (it.t === 'line' || it.t === 'dim') return dSeg(p, ...it.a);
    if (it.t === 'rect') { const [x, y, w, h] = it.a; return Math.min(dSeg(p, x, y, x + w, y), dSeg(p, x + w, y, x + w, y + h), dSeg(p, x, y + h, x + w, y + h), dSeg(p, x, y, x, y + h)); }
    if (it.t === 'pen') { let m = Infinity; for (let k = 0; k + 3 < it.p.length; k += 2) m = Math.min(m, dSeg(p, it.p[k], it.p[k + 1], it.p[k + 2], it.p[k + 3])); return m; }
    if (it.t === 'text') return Math.hypot(p.x - it.a[0], p.y - it.a[1]);
    return Infinity;
  }
  function eraseAt(p) {
    let best = -1, bd = 10 / sc;
    S.items.forEach((it, i) => { const d = dist(it, p); if (d <= bd) { bd = d; best = i; } });
    if (best < 0) { msg('Nothing close enough to erase there.'); return; }
    const it = S.items.splice(best, 1)[0]; hist.push({ op: 'del', it, i: best }); save(); draw(); msg('Erased. Undo restores it.');
  }
  function undo() {
    const h = hist.pop(); if (!h) { msg('Nothing to undo in this session.'); return; }
    if (h.op === 'add') S.items.pop(); else if (h.op === 'del') S.items.splice(h.i, 0, h.it); else if (h.op === 'clear') S.items = h.items;
    save(); draw(); msg('');
  }
  const posTxt = q => `x ${ftin(q.x)}, y ${ftin(q.y)}`;
  function lenTxt() {
    if (!drag || tool === 'pen') return '';
    const a = drag.a, b = drag.b;
    if (tool === 'rect') return `${ftin(Math.abs(b.x - a.x))} × ${ftin(Math.abs(b.y - a.y))}`;
    const L = Math.hypot(b.x - a.x, b.y - a.y); return `Length ${ftin(L)} (${Math.round(L)}")`;
  }
  cv.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    const p = pt(e);
    if (tool === 'text') { const s = $('#blabel').value.trim(); if (!s) { msg('Type the label text in the toolbar first.'); return; } const q = snap(p); add({ t: 'text', a: [q.x, q.y], s: s.slice(0, 60), c: $('#bc').value }); return; }
    if (tool === 'erase') { eraseAt(p); return; }
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* not critical */ }
    const s0 = tool === 'pen' ? { x: r1(p.x), y: r1(p.y) } : snap(p);
    drag = { a: s0, b: s0, pts: [s0.x, s0.y] };
  });
  cv.addEventListener('pointermove', e => {
    const p = pt(e), q = snap(p);
    if (!drag) { $('#bpos').textContent = posTxt(q); return; }
    if (tool === 'pen') { const n = drag.pts.length; if (Math.hypot(p.x - drag.pts[n - 2], p.y - drag.pts[n - 1]) > 0.75) drag.pts.push(r1(p.x), r1(p.y)); }
    else drag.b = (tool === 'line' || tool === 'dim') ? orth(drag.a, q) : q;
    preview = mk(); draw();
    $('#bpos').textContent = lenTxt() || posTxt(q);
  });
  const end = () => { if (!drag) return; const it = mk(); drag = null; preview = null; if (valid(it)) add(it); else draw(); };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', () => { drag = null; preview = null; draw(); });

  $$('.tool[data-t]').forEach(b => b.addEventListener('click', () => {
    tool = b.dataset.t; $$('.tool[data-t]').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    msg(tool === 'text' ? 'Type the label in the text box, then select a spot on the grid.' : tool === 'erase' ? 'Select a line, box, dimension or label to erase it.' : '');
  }));
  $('#ortho').addEventListener('click', () => { ortho = !ortho; $('#ortho').setAttribute('aria-pressed', ortho ? 'true' : 'false'); });
  $('#undo').addEventListener('click', undo);
  $('#clear').addEventListener('click', () => {
    const b = $('#clear');
    if (!clearArm) { b.textContent = 'Select again to clear'; clearArm = setTimeout(() => { b.textContent = 'Clear sheet'; clearArm = null; }, 3000); return; }
    clearTimeout(clearArm); clearArm = null; b.textContent = 'Clear sheet';
    hist.push({ op: 'clear', items: S.items.slice() }); S.items = []; save(); draw(); msg('Sheet cleared. Undo brings it back.');
  });
  $('#bsize').addEventListener('change', e => { S.size = e.target.value; save(); draw(); });
  $('#sheetSel').addEventListener('change', e => { location.hash = '#/board/' + e.target.value; });

  const onKey = e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.target.closest('input,textarea,select')) { e.preventDefault(); undo(); } };
  const onResize = () => draw();
  document.addEventListener('keydown', onKey);
  window.addEventListener('resize', onResize);
  document.addEventListener('themechange', onResize);

  let dl = null;
  const standalone = !(window.claude && typeof window.claude.use === 'function');
  if (standalone) $('#png').hidden = false;
  else window.claude.use('downloads').then(d => { dl = d; if (d) $('#png').hidden = false; }).catch(() => {});
  $('#png').addEventListener('click', () => {
    cv.toBlob(b => {
      if (!b) { msg("The image couldn't be created."); return; }
      const name = `kitchen-bath-${id}.png`;
      if (dl) { dl.save({ filename: name, data: b }).then(() => msg('Saved.')).catch(err => { if (!err || err.code !== 'declined') msg("The image couldn't be saved here."); }); return; }
      if (!standalone) return;
      const url = URL.createObjectURL(b), a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      msg('Downloaded.');
    }, 'image/png');
  });

  draw();
  Store.pull(key).then(changed => { if (changed) { if (!Array.isArray(S.items)) S.items = []; $('#bsize').value = S.size || 'm'; draw(); } });
  return () => { document.removeEventListener('keydown', onKey); window.removeEventListener('resize', onResize); document.removeEventListener('themechange', onResize); clearTimeout(clearArm); };
}

/* ---------- theme ---------- */
const THEMES = ['auto', 'light', 'dark'], THEME_LBL = { auto: 'Theme: automatic', light: 'Theme: vellum', dark: 'Theme: blueprint' };
let theme = 'auto';
try { theme = localStorage.getItem('kbd40:theme') || 'auto'; } catch (e) { theme = 'auto'; }
function applyTheme() {
  const r = document.documentElement;
  if (theme === 'light' || theme === 'dark') r.setAttribute('data-theme', theme); else r.removeAttribute('data-theme');
  const b = $('#themeBtn'); if (b) b.textContent = THEME_LBL[theme] || THEME_LBL.auto;
  document.dispatchEvent(new Event('themechange'));
}

/* ---------- router ---------- */
let cleanup = null;
function route() {
  if (cleanup) { try { cleanup(); } catch (e) { /* ignore */ } cleanup = null; }
  const r = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  let v;
  try {
    if (!r.length) v = viewHome();
    else if (r[0] === 'm') {
      const m = MODS[+r[1] - 1];
      if (!m) v = notFound();
      else if (!r[2]) v = viewModule(m);
      else if (r[2] === 'l') v = viewLesson(m, +r[3]);
      else if (r[2] === 'lab') v = viewLab(m);
      else if (r[2] === 'review') v = viewReview(m);
      else if (r[2] === 'cards') v = viewCards(m);
      else if (r[2] === 'quiz') v = viewQuiz(m);
      else v = notFound();
    }
    else if (r[0] === 'test' && (r[1] === 'midterm' || r[1] === 'final')) v = viewTest(r[1]);
    else if (r[0] === 'capstone') v = viewCapstone();
    else if (r[0] === 'board') v = viewBoard(r[1] || 'free');
    else if (r[0] === 'tools') v = viewTools();
    else if (r[0] === 'glossary') v = viewGlossary();
    else if (r[0] === 'reference') v = viewReference();
    else if (r[0] === 'cards') v = viewCards(null);
    else v = notFound();
  } catch (e) {
    console.error(e);
    v = { id: '', title: 'Something went wrong', html: `<h1 class="pt">This page didn't load</h1><p class="lede">${esc(e.message)}</p><p><a class="btn pri" href="#/">Go to course home</a></p>` };
  }
  main.innerHTML = `<div class="page">${v.html}</div>`;
  document.title = (v.title ? v.title + ' · ' : '') + 'Kitchen & Bath Design';
  renderNav(v.id);
  closeSide();
  window.scrollTo(0, 0);
  const h1 = $('h1', main); if (h1) { h1.setAttribute('tabindex', '-1'); try { h1.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
  if (v.after) { try { cleanup = v.after() || null; } catch (e) { console.error(e); } }
  if (v.track) { P().last = location.hash; saveP(); }
}

/* ---------- start ---------- */
Store.setOnMode(m => { const el = $('#sync'); if (el) el.textContent = m === 'account' ? 'Progress saves to your account' : m === 'full' ? 'Account storage is full, so progress saves in this browser' : 'Progress saves in this browser'; });
applyTheme();
$('#themeBtn').addEventListener('click', () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]; try { localStorage.setItem('kbd40:theme', theme); } catch (e) { /* ignore */ } applyTheme(); });
$('#menuBtn').addEventListener('click', () => { if ($('#side').classList.contains('open')) closeSide(); else openSide(); });
$('#scrim').addEventListener('click', closeSide);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#side').classList.contains('open')) { closeSide(); $('#menuBtn').focus(); } });
window.addEventListener('hashchange', route);
route();
Store.connect(['progress', 'notes']).then(changed => {
  if (!changed) return;
  if (/^#\/(m\/\d+\/quiz|test|board)/.test(location.hash)) renderNav(); else route();
});

})();

</script>
</body>
