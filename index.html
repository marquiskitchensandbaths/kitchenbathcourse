COURSE.modules.push({
id: `m5`, n: 5, title: `Kitchen planning`,
sum: `How to plan kitchens that work: work centers and zones, the work triangle, layout types, traffic and seating clearances, landing areas, countertop frontage and storage. These are the guideline numbers you'll use on every kitchen.`,
obj: [`Organize a kitchen into work centers and zones.`, `Choose an appropriate layout for a room and household.`, `Apply clearance, landing-area and countertop guidelines.`, `Estimate storage needs and plan storage at the point of first use.`],
lessons: [
{ id: `m5l1`, t: `Work centers, zones & the work triangle`, min: 30, h: `
<p>A kitchen is a series of tasks: getting food out, prepping it, cooking it, serving it and cleaning up. Good plans put the tools for each task where the task happens and keep the paths between tasks short and clear.</p>
<h3>Primary work centers</h3>
<ul>
<li><b>Cleanup and prep:</b> the primary sink, with the dishwasher, waste and recycling nearby.</li>
<li><b>Cooking:</b> the cooktop or range, plus ovens and microwave.</li>
<li><b>Refrigeration:</b> the primary refrigerator.</li>
</ul>
<p>Secondary centers include a preparation area (continuous counter beside a sink), serving, baking and beverage centers.</p>
<h3>Zone planning</h3>
<p>Many designers plan by zones: <b>consumables</b> (food storage), <b>non-consumables</b> (dishes, glassware, flatware), <b>cleaning</b> (sink, dishwasher, trash), <b>preparation</b> (counter, knives, bowls, small appliances) and <b>cooking</b> (cooktop, pots, utensils, spices). Store each item at its point of first use, and let the zones flow in the order food moves through the kitchen.</p>
<h3>The work triangle</h3>
<p>The work triangle connects the center front of the primary sink, the primary cooking surface and the refrigerator. NKBA's guideline:</p>
<aside class="rule"><p>The sum of the three legs should be <b>no more than 26'</b>, and no single leg should be <b>less than 4' or more than 9'</b>. No leg should cut through an island or peninsula by more than 12". Major traffic shouldn't cross the triangle, and a full-height, full-depth tall obstacle (such as a tall oven cabinet) shouldn't separate two primary work centers.</p></aside>
<fig name="triangle">An L-shaped kitchen with an island sink. All three legs fall between 4' and 9', the total is well under 26', and the traffic path between the mudroom door and the family room stays outside the triangle.</fig>
<p>Legs that are too short crowd the cook and leave no landing space; legs that are too long mean miles of walking. With two cooks, give each cook a triangle; they may share a leg, but their paths shouldn't cross. In large, open kitchens the triangle is a useful check rather than the whole story, and zone planning takes over.</p>` },
{ id: `m5l2`, t: `Kitchen layouts`, min: 30, h: `
<p>Most kitchens are variations on six basic layouts. The room's size and shape, its doors and windows, the number of cooks and where people eat usually narrow the choice to one or two.</p>
<fig name="layouts">The six basic layouts. F is the refrigerator, S the sink and R the range; the blue line is the work triangle.</fig>
<table><thead><tr><th>Layout</th><th>Strengths</th><th>Watch for</th></tr></thead><tbody>
<tr><td>One-wall</td><td>Compact; fits apartments and open plans</td><td>No true triangle; limited counter. Put the sink between the refrigerator and range with counter on both sides.</td></tr>
<tr><td>Galley (corridor)</td><td>Very efficient for one cook; short legs</td><td>Aisle of 42"–48"; through-traffic if both ends are open</td></tr>
<tr><td>L-shape</td><td>Open to eating or living areas; good triangle</td><td>Needs a corner storage solution; long legs if the walls are long</td></tr>
<tr><td>U-shape</td><td>Maximum counter and storage; traffic stays out</td><td>Two corners; keep at least 42"–48" between the legs</td></tr>
<tr><td>G-shape (peninsula)</td><td>More counter and seating than a U</td><td>Can feel enclosed; watch the entry path</td></tr>
<tr><td>Island</td><td>Adds counter, storage, seating and a work center</td><td>Needs proper aisles on every working side</td></tr>
</tbody></table>
<h3>Will an island fit?</h3>
<p>Add up the plan across the room. With 25"-deep countertops on two opposite walls, two 42" work aisles and a 36"-deep island, you need 25 + 42 + 36 + 42 + 25 = 170", just over 14 feet. Use 48" aisles for two cooks and add more depth if the island has seating. Doing this arithmetic early saves a client from falling in love with an island the room can't hold.</p>
<aside class="tip"><p><b>Start with openings.</b> Doors and wide cased openings define the traffic paths. Sketch those paths first, then fit the work centers around them so traffic doesn't cut through the triangle.</p></aside>` },
{ id: `m5l3`, t: `Traffic, aisles & seating clearances`, min: 30, h: `
<p>Clearances determine whether a kitchen feels comfortable or cramped. Measure them between the finished surfaces people actually bump into: countertop edges, appliance fronts and handles, and tall cabinet faces.</p>
<aside class="rule"><p><b>NKBA clearance guidelines</b></p><ul>
<li>Entry doorways: at least 32" clear opening (typically a 2'-10" door or wider).</li>
<li>Work aisles: at least <b>42"</b> for one cook and <b>48"</b> for multiple cooks.</li>
<li>Walkways (no work happening): at least <b>36"</b>.</li>
<li>Behind a seated diner: 32" to a wall or obstruction if no traffic passes, 36" for someone to edge past, 44" to walk past.</li>
<li>Door interference: entry doors shouldn't interfere with appliances, and appliance doors shouldn't interfere with each other.</li>
</ul></aside>
<fig name="clearances">Work aisles and walkways in blue; seating clearance in brass. Measure from counter edges and appliance fronts, not from cabinet boxes.</fig>
<h3>Seating</h3>
<p>Each diner needs a 24"-wide space. Depth and knee space depend on height:</p>
<table><thead><tr><th>Surface height</th><th>Space per diner</th><th>Clear knee space</th><th>Typical seat height</th></tr></thead><tbody>
<tr><td>30" (table)</td><td>24" W × 18" D</td><td>18"</td><td>about 18"</td></tr>
<tr><td>36" (counter)</td><td>24" W × 15" D</td><td>15"</td><td>about 24"–26"</td></tr>
<tr><td>42" (bar)</td><td>24" W × 12" D</td><td>12"</td><td>about 28"–30"</td></tr>
</tbody></table>
<fig name="seatingHeights">Seating at the three standard heights. Lower surfaces need deeper knee space.</fig>
<p><b>Worked example:</b> a 96"-long island at counter height seats 96 ÷ 24 = 4 people, with a 15"-deep overhang for knee space.</p>
<aside class="warn"><p><b>Support long overhangs.</b> Many fabricators limit unsupported overhangs of 3 cm stone to roughly 10"–12", and less for 2 cm. Beyond that, specify corbels, brackets or concealed steel supports as the fabricator directs.</p></aside>` },
{ id: `m5l4`, t: `Landing areas & countertop space`, min: 30, h: `
<p>A landing area is counter space right next to an appliance or sink where you set things down: hot pans off the cooktop, groceries at the refrigerator, dirty dishes at the sink. Missing landing areas are among the most common and most dangerous planning errors.</p>
<aside class="rule"><p><b>NKBA landing-area guidelines</b></p><ul>
<li><b>Primary sink:</b> at least 24" of counter on one side and 18" on the other.</li>
<li><b>Preparation area:</b> a continuous counter at least 36" wide × 24" deep immediately next to a sink.</li>
<li><b>Dishwasher:</b> its nearest edge within 36" of the nearest edge of a sink, with at least 21" of standing space between the dishwasher's edge and counters, appliances or cabinets at a right angle to it.</li>
<li><b>Refrigerator:</b> 15" on the handle side; or 15" on either side of a side-by-side; or 15" no more than 48" across from the refrigerator's front; or 15" above or beside undercounter refrigeration.</li>
<li><b>Cooking surface:</b> 12" on one side and 15" on the other. At an island or peninsula, add 9" of counter behind the cooking surface when the counter is at the same height.</li>
<li><b>Oven:</b> 15" beside or above it, or 15" no more than 48" across from it if the oven doesn't open into a walkway.</li>
<li><b>Microwave:</b> 15" above, below or beside the handle side.</li>
<li><b>Auxiliary sink:</b> at least 3" on one side and 18" on the other.</li>
<li><b>Waste:</b> at least two receptacles, one near the cleanup sink and one for recycling.</li>
</ul></aside>
<fig name="landing">Landing areas in blue. The dishwasher sits 3" from the sink edge, and 23" of standing space remains between it and the cabinets on the adjacent wall.</fig>
<h3>When landing areas meet</h3>
<p>If two landing areas share the same stretch of counter, the guideline is to take the longer of the two requirements and add 12". A sink (24") next to a range (15") therefore needs at least 24 + 12 = 36" of counter between them.</p>
<h3>Total countertop</h3>
<p>NKBA recommends a total of <b>158"</b> of countertop frontage, 24" deep with at least 15" of clearance above, for all uses combined: landing areas, prep and storage of small appliances. Specify clipped or rounded corners rather than sharp ones, especially on islands and near walkways.</p>
<aside class="tip"><p><b>Check hot paths.</b> Trace how a pot of boiling pasta gets from the cooktop to the sink. If the cook has to turn around through a walkway or pass a child's seating spot to get there, rethink the layout.</p></aside>` },
{ id: `m5l5`, t: `Storage planning`, min: 30, h: `
<p>Storage is where clients feel a kitchen's quality every day. The goal isn't just capacity; it's putting each item where it's first used, at a height that's easy to reach.</p>
<h3>How much storage</h3>
<p>NKBA expresses storage as <b>shelf and drawer frontage</b>: the width of each shelf, drawer or roll-out, in inches, added up across the kitchen. A 24" base with four drawers contributes 24 × 4 = 96". Targets depend on kitchen size:</p>
<table><thead><tr><th>Kitchen size</th><th>Total frontage</th><th>Within 72" of the primary sink's centerline</th></tr></thead><tbody>
<tr><td>Small (up to 150 sq ft)</td><td>1,400"</td><td>400"</td></tr>
<tr><td>Medium (151–350 sq ft)</td><td>1,700"</td><td>480"</td></tr>
<tr><td>Large (over 350 sq ft)</td><td>2,000"</td><td>560"</td></tr>
</tbody></table>
<h3>Reach and access</h3>
<ul>
<li>Keep daily items between hip and shoulder height, heavy items low, and rarely used items high.</li>
<li>Drawers beat doors in base cabinets: you see and reach everything without kneeling. Deep drawers for pots and dishes are among the most appreciated upgrades.</li>
<li>Upper shelves of wall cabinets are beyond many people's comfortable reach. Put everyday dishes on the lowest shelf, or in drawers.</li>
<li>Pantry shelves 12"–16" deep keep food visible; very deep shelves hide things.</li>
</ul>
<h3>Corners</h3>
<p>At least one corner cabinet should include a functional storage device: a lazy Susan, a blind-corner pull-out, a diagonal corner cabinet, or corner drawers. Allow for the pull distance of blind corners and fillers so doors and handles don't collide.</p>
<h3>Specialty storage</h3>
<p>Tray dividers near the oven, spice pull-outs near the cooktop, knife and utensil drawers near prep, waste and recycling pull-outs by the sink, appliance garages for small appliances, charging drawers, and cleaning-supply storage in the sink base. Each one answers a line from the client's storage inventory.</p>
<aside class="tip"><p><b>Plan from the inventory.</b> Match every category from the Module 1 storage inventory to a specific cabinet. If something has no home on the plan, it will live on the counter.</p></aside>` }
],

sum: `Cabinet construction, standard sizes and nomenclature, door styles, materials and finishes, and how to specify a cabinet order without the errors that cost weeks.`,
obj: [`Compare face-frame and frameless construction and the door overlays each allows.`, `Specify standard cabinet sizes using manufacturer-style codes.`, `Choose door styles, materials and finishes suited to the use.`, `Plan fillers, corners, panels and hinge sides, and prepare an accurate cabinet list.`],
lessons: [
{ id: `m6l1`, t: `Cabinet construction`, min: 30, h: `
<p>Cabinets are usually the largest single line item in a kitchen budget, and their construction decides how they look, how much they hold and how long they last.</p>
<h3>Face-frame and frameless</h3>
<p><b>Face-frame</b> cabinets have a frame of solid-wood stiles (vertical) and rails (horizontal) on the front of the box. The frame adds rigidity and allows inset doors, but its stiles narrow the opening. <b>Frameless</b> cabinets, also called European or 32 mm system cabinets, have no frame: the box edges are banded and doors cover them completely. Frameless cabinets offer full access to the interior and use standardized 32 mm hole spacing for hinges and shelves.</p>
<h3>Door overlays</h3>
<fig name="overlays">A 30" × 30" double-door wall cabinet in four constructions. The amount of frame showing is the quickest way to tell them apart.</fig>
<ul>
<li><b>Partial (standard) overlay:</b> doors cover part of the frame, and frame shows between and around them. Economical and traditional.</li>
<li><b>Full overlay:</b> doors cover nearly all of the frame with small reveals, for a cleaner look.</li>
<li><b>Inset:</b> doors sit flush inside the frame openings. Precise, classic and usually custom; hinges may be exposed, and the frame reduces interior access slightly.</li>
<li><b>Frameless:</b> inherently full overlay, with the most interior access.</li>
</ul>
<h3>Box materials</h3>
<table><thead><tr><th>Material</th><th>Strengths</th><th>Watch-outs</th></tr></thead><tbody>
<tr><td>Plywood</td><td>Strong, lighter, holds screws well, tolerates moisture better</td><td>Higher cost; surface can vary</td></tr>
<tr><td>Particleboard (furniture board)</td><td>Flat, stable, economical</td><td>Swells if it gets wet; weaker screw holding</td></tr>
<tr><td>MDF</td><td>Very smooth; ideal for painted doors and panels</td><td>Heavy; swells if water gets in</td></tr>
</tbody></table>
<p>Interiors are commonly melamine or thermally fused laminate (TFL), or wood veneer.</p>
<h3>Joinery, drawers and hardware</h3>
<ul>
<li><b>Joinery:</b> dadoes, rabbets, dowels and mortise-and-tenon in better cabinets; cam fasteners in ready-to-assemble lines; glue and staples in economy lines.</li>
<li><b>Drawer boxes:</b> dovetailed solid wood or plywood, metal drawer systems, or stapled particleboard in economy lines.</li>
<li><b>Slides:</b> full-extension slides let you reach the back of the drawer; 3/4-extension slides don't. Undermount concealed slides with soft-close are the premium standard. Check load ratings for pot and pantry drawers.</li>
<li><b>Hinges:</b> concealed "European" cup hinges (35 mm cup) adjust in three directions and come in soft-close and wide-opening versions. Inset work may use butt or exposed hinges.</li>
</ul>
<h3>Quality marks</h3>
<p>KCMA certification means a cabinet line passed standardized tests of structural integrity and finish durability (ANSI/KCMA A161.1). Composite wood products sold in the U.S. must also meet formaldehyde emission limits under federal rules (TSCA Title VI).</p>` },
{ id: `m6l2`, t: `Sizes, nomenclature & fillers`, min: 30, h: `
<fig name="cabinetSection">Standard heights and depths. With a 96" ceiling, 42" wall cabinets starting at 54" reach the ceiling.</fig>
<h3>Standard sizes</h3>
<table><thead><tr><th>Type</th><th>Height</th><th>Depth</th><th>Widths</th></tr></thead><tbody>
<tr><td>Base</td><td>34-1/2" (36" with a 1-1/2" top)</td><td>24"</td><td>9"–48", usually in 3" steps</td></tr>
<tr><td>Wall</td><td>12", 15", 18", 24", 30", 36", 42"</td><td>12" (some 13"–15"); 24" over refrigerators</td><td>9"–36"+</td></tr>
<tr><td>Tall (pantry, utility, oven)</td><td>84", 90", 96"</td><td>12" or 24"</td><td>18"–36"</td></tr>
<tr><td>Vanity</td><td>about 30-1/2"–34-1/2" box</td><td>21" (18" shallow)</td><td>12"–72"+</td></tr>
</tbody></table>
<p>The toe kick is typically about 4" to 4-1/2" high and 3" deep. The standard gap between counter and wall cabinets is 18", putting the bottom of wall cabinets at 54" above the floor.</p>
<h3>Cabinet codes</h3>
<p>Manufacturers identify cabinets with codes that encode type and size. Formats vary by manufacturer, but these patterns are typical:</p>
<table><thead><tr><th>Code</th><th>Meaning</th></tr></thead><tbody>
<tr><td>B15</td><td>Base, 15" wide</td></tr>
<tr><td>DB18 or 3DB18</td><td>Drawer base (three drawers), 18" wide</td></tr>
<tr><td>SB36</td><td>Sink base, 36" wide</td></tr>
<tr><td>BLS36 / BBC42</td><td>Base lazy Susan 36" / base blind corner 42"</td></tr>
<tr><td>W3030</td><td>Wall, 30" wide × 30" high</td></tr>
<tr><td>W3615 / W362424</td><td>Wall 36" × 15" / wall 36" × 24" high × 24" deep (over a refrigerator)</td></tr>
<tr><td>P1884 / OV3384</td><td>Pantry 18" × 84" / oven cabinet 33" × 84"</td></tr>
<tr><td>F3, BF3, WF3</td><td>Fillers, 3" wide</td></tr>
<tr><td>REP / DWR</td><td>Refrigerator end panel / dishwasher return panel</td></tr>
</tbody></table>
<fig name="elevationCodes">A 120" wall between two walls: 3 + 15 + 36 + 24 + 18 + 24 = 120. The dashed V on each door points to its hinges.</fig>
<h3>Fillers and scribes</h3>
<p>Fillers, usually 1" to 3" wide and ripped to fit on site, are placed where cabinets meet walls and at inside corners so doors and drawers can open past adjacent cabinets, casings and handles. Scribe molding is trimmed to follow uneven walls. At inside corners, plan enough filler that drawers on one run clear the handles on the other.</p>
<h3>Panels and moldings</h3>
<p>Finished end panels cover exposed cabinet sides; decorative panels and island back panels dress visible faces. Crown molding tops wall cabinets, light rail under wall cabinets hides under-cabinet lights, and toe-kick material finishes the base. Panel-ready appliances need panels ordered to the appliance maker's specifications.</p>` },
{ id: `m6l3`, t: `Doors, materials & finishes`, min: 25, h: `
<fig name="doorStyles">Common door styles. Shaker (a five-piece door with a flat recessed panel) is the most versatile.</fig>
<h3>Door construction</h3>
<p>A <b>five-piece</b> door has two stiles, two rails and a center panel that may be flat (recessed) or raised. A <b>slab</b> door is a single flat piece: MDF or particleboard with veneer, laminate, thermofoil or paint, or glued-up solid wood.</p>
<h3>Wood species</h3>
<ul>
<li><b>Maple:</b> fine, even grain; paints well; can blotch with dark stains.</li>
<li><b>Cherry:</b> smooth grain that darkens noticeably with light and age.</li>
<li><b>Oak:</b> prominent grain. Quartersawn white oak shows ray fleck; rift-sawn white oak has straight, even grain popular in modern kitchens.</li>
<li><b>Hickory:</b> dramatic color variation and very hard.</li>
<li><b>Walnut:</b> rich dark brown, often used as veneer.</li>
<li><b>Alder:</b> soft, even grain; often sold in knotty versions.</li>
</ul>
<h3>Wood moves</h3>
<p>Solid wood expands and contracts with humidity. Five-piece doors let the center panel float in its frame for this reason. On painted wood doors, the seasonal movement often shows as a hairline crack at the joints between stiles and rails. That's normal, not a defect, and clients who are told in advance don't worry about it.</p>
<h3>Finishes</h3>
<ul>
<li><b>Stain with a clear topcoat</b> shows the grain; <b>paint</b> hides it; <b>glaze</b> adds color in recesses.</li>
<li>Durable factory topcoats include catalyzed lacquer and conversion varnish.</li>
<li><b>Thermofoil</b> (vinyl film over MDF) is economical but can peel from heat; use heat shields next to ovens.</li>
<li><b>Laminates</b> (high-pressure laminate, TFL) and high-gloss acrylic suit contemporary slab doors.</li>
</ul>
<h3>Cabinet grades</h3>
<p><b>Stock</b> cabinets come in fixed sizes and finishes and ship fastest. <b>Semi-custom</b> lines add sizes, finishes and modifications such as reduced depths. <b>Custom</b> cabinets are built to order in any size and finish and take the longest. <b>Ready-to-assemble</b> (RTA) cabinets ship flat. Lead times vary widely by manufacturer and season, so confirm them before you promise an install date.</p>` },
{ id: `m6l4`, t: `Specifying & ordering`, min: 25, h: `
<p>A cabinet order can hold dozens of line items, and one wrong code can delay a project by weeks. Treat ordering as a checklist, not a formality.</p>
<ol>
<li><b>Confirm field dimensions</b> with a check measure after rough-in or drywall where possible.</li>
<li><b>Lock appliance models</b> and download their installation specifications: cutouts, clearances, panels and utility locations.</li>
<li><b>Lay out each wall on an elevation</b> with codes. The cabinets, fillers and panels must add up to the wall, with filler or scribe allowance where cabinets meet walls.</li>
<li><b>Check every corner:</b> drawer and door clearance, handle clearance, and the pull distance of blind corners.</li>
<li><b>Check every door</b> against window casings, appliances and other doors.</li>
<li><b>Assign hinge sides</b> on the plan and elevations, thinking about work flow and the user's handedness. Doors should open away from the main work area.</li>
<li><b>List accessories:</b> roll-outs, dividers, waste pull-outs, lighting provisions.</li>
<li><b>List moldings, panels, fillers, toe kick and hardware</b>, with quantities and sizes.</li>
<li><b>Review with the client and get a signature,</b> then place the order.</li>
<li><b>Check the manufacturer's acknowledgment</b> line by line against your drawings the day it arrives.</li>
</ol>
<h3>Hardware placement</h3>
<p>Knobs on doors usually sit 2"–3" from the corner opposite the hinges: near the top of base cabinet doors and near the bottom of wall cabinet doors. Drawer pulls are centered, and wide drawers (about 30" and up) get two pulls or one long pull. Watch for hardware collisions at inside corners, which is another reason for fillers.</p>
<aside class="tip"><p><b>Worked example.</b> A 120" wall between two walls: B15 + SB36 + DW24 + DB18 + B24 = 117". The remaining 3" becomes a filler at the wall, where it also lets the B15 door clear the wall.</p></aside>` }
],

COURSE.modules.push({
id: `m7`, n: 7, title: `Countertops, surfaces & tile`,
sum: `Countertop materials and fabrication details, plus flooring, tile and the waterproof assemblies that keep wet areas dry.`,
obj: [`Compare countertop materials by performance, maintenance and cost.`, `Specify edges, thickness, overhangs, seams and sink mounting.`, `Select flooring and tile using abrasion, absorption and slip-resistance data.`, `Plan tile layouts and waterproofing for wet areas.`],
lessons: [
{ id: `m7l1`, t: `Countertop materials`, min: 30, h: `
<p>Countertops take more abuse than any other kitchen surface: knives, heat, acids, stains, standing water and daily cleaning. The right choice balances appearance, performance, maintenance and budget, and depends honestly on how the client cooks.</p>
<table><thead><tr><th>Material</th><th>Strengths</th><th>Watch-outs</th></tr></thead><tbody>
<tr><td>Laminate (HPL)</td><td>Affordable; endless patterns</td><td>Visible seams; scorches; water at seams swells the substrate; undermount sinks generally not recommended</td></tr>
<tr><td>Solid surface</td><td>Seamless look; integral sinks; scratches can be sanded out</td><td>Scratches and heat marks; use trivets</td></tr>
<tr><td>Engineered quartz</td><td>Nonporous; consistent; low maintenance</td><td>Resin can scorch or discolor from heat; some products fade in sun</td></tr>
<tr><td>Granite</td><td>Hard; heat-tolerant; every slab unique</td><td>Porosity varies, so some need sealing; select slabs in person</td></tr>
<tr><td>Marble</td><td>Classic veining; cool for baking</td><td>Etches from acids and scratches; develops patina</td></tr>
<tr><td>Quartzite</td><td>Very hard and heat-resistant</td><td>Some stones sold as quartzite are actually softer marble or dolomite; verify</td></tr>
<tr><td>Soapstone</td><td>Dense and stain-resistant; darkens with oil</td><td>Soft; scratches, though they can be sanded</td></tr>
<tr><td>Porcelain and sintered slabs</td><td>Resist heat, stains and UV; thin profiles</td><td>Edges and corners can chip; pattern may be surface-printed; specialized fabrication</td></tr>
<tr><td>Wood (butcher block)</td><td>Warm; renewable; repairable</td><td>Needs oiling; vulnerable around sinks unless sealed</td></tr>
<tr><td>Stainless steel</td><td>Hygienic; heat-proof; integral sinks</td><td>Scratches into a patina; dents; can be noisy</td></tr>
<tr><td>Concrete</td><td>Custom shapes and colors</td><td>Needs sealing; can stain or crack; heavy</td></tr>
</tbody></table>
<h3>Natural stone realities</h3>
<p>"Granite" in the trade covers many stone types, and performance varies slab to slab. Marble is calcite, which reacts with acids such as lemon, vinegar and wine to leave dull etch marks. Sealing reduces staining but doesn't prevent etching. A honed (matte) finish hides etching better than polished. If a client loves marble, explain the patina it will develop and make sure they're choosing it with open eyes.</p>
<h3>Engineered stone and fabricator safety</h3>
<p>Cutting and polishing engineered quartz releases respirable crystalline silica, and silicosis among fabrication workers has become a serious industry health issue. Some jurisdictions have restricted engineered stone; Australia banned it from 2024. Expect evolving regulations, and favor fabricators who use wet cutting and proper protection.</p>
<aside class="tip"><p><b>Match the material to the cook.</b> Ask how the client really uses the kitchen. A pastry baker may love marble at a baking station; a family that sets hot pans down anywhere may be happier with porcelain, granite or soapstone.</p></aside>` },
{ id: `m7l2`, t: `Fabrication details`, min: 30, h: `
<h3>Thickness</h3>
<p>Stone and quartz slabs typically come in 2 cm (about 3/4") and 3 cm (about 1-1/4") thicknesses. 2 cm material is often installed over a plywood substrate or built up at the edge to look thicker. Laminate tops are usually built up to about 1-1/2".</p>
<h3>Edge profiles</h3>
<fig name="edges">Edge profiles in section. Rounded and eased edges resist chipping and are kinder to hips and small children.</fig>
<p>Specify clipped or rounded corners rather than sharp ones, especially on islands and along walkways.</p>
<h3>Overhangs</h3>
<p>The front edge typically overhangs the cabinet face by about 1" to 1-1/2", so a 24" base gets a 25"–25-1/2" deep top. Seating overhangs follow the seating guidelines (12" to 18" depending on height). Long overhangs need support as the fabricator directs; unsupported 3 cm stone is commonly limited to about 10"–12".</p>
<h3>Seams</h3>
<p>Slab size limits run length, and every material has its own maximum slab. Plan seam locations with the fabricator: away from sink and cooktop cutouts where possible, not through narrow strips in front of cutouts, and where veining can be matched. Show seams on the countertop plan and review them with the client before fabrication.</p>
<h3>Sink mounting</h3>
<ul>
<li><b>Undermount:</b> clean edge, easy to wipe crumbs in; requires a solid material such as stone, quartz or solid surface. Reveal options: positive (rim shows), negative (counter overhangs the bowl) or flush.</li>
<li><b>Drop-in (self-rimming):</b> the sink rim sits on the counter; works with laminate.</li>
<li><b>Apron-front (farmhouse):</b> needs a matching sink base cabinet.</li>
<li><b>Integral:</b> the sink is made of the same material as the counter, as with solid surface, stainless steel or concrete.</li>
</ul>
<h3>Cutouts and templating</h3>
<p>Cooktop cutouts follow the manufacturer's template. Faucet holes depend on the faucet (single-hole, 4" centerset, 8" widespread), plus any soap dispenser, filtered-water faucet, air gap or pop-up outlet. The fabricator templates after the base cabinets are installed and level, with the sink, faucet and cooktop models confirmed and usually on site. Fabrication typically takes days to a couple of weeks; the plumber connects the sink and faucet after installation.</p>
<h3>Backsplashes</h3>
<p>Options include a 4" splash of the counter material, a full-height slab splash, or tile. End splashes finish counters that die into a wall.</p>` },
{ id: `m7l3`, t: `Flooring, tile & wet areas`, min: 30, h: `
<h3>Flooring</h3>
<p>Kitchen and bath floors must handle water, dropped objects, long periods of standing and constant cleaning. Common choices include porcelain and ceramic tile, natural stone, solid or engineered hardwood, luxury vinyl plank or tile (LVP/LVT, often with rigid SPC or WPC cores), sheet vinyl, linoleum, cork and concrete. Weigh water resistance, comfort, durability, slip resistance, maintenance, compatibility with radiant heat, and transitions to adjacent rooms.</p>
<aside class="warn"><p><b>Floor under the appliances.</b> If flooring goes in after the cabinets, make sure finished flooring (or material at the same height) extends under the dishwasher, range and refrigerator openings. Otherwise the new floor can trap a dishwasher under the counter or block an appliance from sliding out.</p></aside>
<h3>Tile specifications</h3>
<table><thead><tr><th>Term</th><th>What it means</th></tr></thead><tbody>
<tr><td>Porcelain</td><td>Dense tile with water absorption of 0.5% or less (ANSI A137.1); suited to floors, wet areas and exteriors</td></tr>
<tr><td>Ceramic (non-porcelain)</td><td>Higher absorption; often used on walls</td></tr>
<tr><td>PEI class</td><td>Abrasion resistance of glazed tile, from 0 (walls only) to 5 (heavy traffic). Class 3 or higher generally suits residential floors.</td></tr>
<tr><td>DCOF</td><td>Dynamic coefficient of friction. Level interior floors expected to be walked on when wet should be at least 0.42.</td></tr>
<tr><td>Rectified</td><td>Edges ground square and true, allowing narrower grout joints</td></tr>
<tr><td>Large-format tile</td><td>Tile with any side 15" or longer; needs a very flat substrate and appropriate mortar</td></tr>
</tbody></table>
<fig name="tilePatterns">Common layout patterns. For rectangular tiles with a side longer than 18", industry standards limit the offset to 33% unless the manufacturer says otherwise, because slight warpage makes 50% offsets show lippage (uneven edges).</fig>
<h3>Grout and movement joints</h3>
<p>Use sanded grout for joints 1/8" and wider, unsanded for narrower joints, and epoxy grout where stain resistance matters, such as countertops and showers. Tile needs movement joints at perimeters and changes of plane: fill inside corners of showers and the joint between countertop and backsplash with flexible sealant, not grout.</p>
<h3>Waterproofing wet areas</h3>
<p>Tile and grout are not waterproof. Showers need a waterproof layer behind and beneath the tile: either a traditional mortar bed over a pre-sloped liner, or a bonded waterproofing membrane (sheet or liquid-applied, ANSI A118.10) over cement board or foam board. Shower floors slope to the drain, typically 1/4" per foot. A <b>linear drain</b> lets the floor slope in one plane, which makes curbless showers and large-format floor tile much easier. Niches and benches must be waterproofed and sloped too.</p>
<h3>Layout</h3>
<p>Dry-lay tile before setting it. Center the layout on focal points such as the hood, window or niche; avoid slivers smaller than half a tile at edges; and plan how every edge ends: bullnose, metal edge trim, or dying into a cabinet side or ceiling.</p>` }
],

id: `m8`, n: 8, title: `Appliances & ventilation`,
sum: `Selecting and placing cooking, refrigeration and cleanup appliances, and sizing ventilation that actually captures and removes what cooking produces.`,
obj: [`Compare cooking appliance types and fuels and place them safely.`, `Plan refrigeration and cleanup appliances with correct clearances.`, `Size hoods for capture and airflow, including ducting and makeup air.`, `Build an appliance specification schedule.`],
lessons: [
{ id: `m8l1`, t: `Cooking appliances`, min: 30, h: `
<p>Appliance choices shape the plan: a 48" range, a wall-oven column or a speed oven each change cabinetry, electrical and ventilation. Settle appliance models early, and design from the manufacturer's installation instructions, never from memory.</p>
<h3>Ranges</h3>
<ul>
<li><b>Freestanding:</b> finished sides and a backguard with controls at the back. Standard width is 30".</li>
<li><b>Slide-in:</b> no backguard, front controls, and a slight overlap onto the countertop for a built-in look.</li>
<li><b>Professional-style:</b> 30", 36", 48" and 60" widths with high-output burners. These often need more clearance, heavier ventilation and larger gas lines.</li>
<li><b>Dual-fuel:</b> a gas cooktop with an electric oven.</li>
</ul>
<h3>Cooktops and rangetops</h3>
<p><b>Gas</b> cooktops are rated in BTUs per burner. <b>Electric radiant</b> cooktops heat elements under glass. <b>Induction</b> uses a magnetic field to heat the pan directly: it's fast, efficient and precise, the glass around the pan stays relatively cool, and it needs magnetic cookware (a magnet should stick to the bottom). Induction and electric units need large dedicated circuits, so check the panel early. A <b>rangetop</b> is a cooktop with front controls that sits on a base cabinet like a range without an oven.</p>
<h3>Ovens and microwaves</h3>
<p>Wall ovens come in single, double and combination (oven plus microwave or speed oven) versions, typically 27" or 30" wide, installed in tall oven cabinets or under a counter. Steam and combi-steam ovens, speed ovens and warming drawers round out the options. Side-swing and slide-under doors help users who can't reach over a drop-down door. Microwaves may be over-the-range (which doubles as a weak hood), countertop, built-in with a trim kit, or drawer-style below the counter.</p>
<aside class="rule"><p><b>NKBA placement guidelines</b></p><ul>
<li>Don't place a cooking surface below an operable window, and don't use flammable window treatments above it.</li>
<li>Keep a fire extinguisher near the kitchen exit, away from the cooking equipment.</li>
<li>Clearance above a cooking surface: 24" to a protected noncombustible surface and 30" to an unprotected or combustible one; for hoods and over-the-range microwaves, follow the manufacturer.</li>
<li>Microwave: ideally its bottom is about 3" below the principal user's shoulder, and no more than 54" above the floor. A below-counter microwave's bottom should be at least 15" off the floor.</li>
</ul></aside>
<p>Ranges also need their anti-tip device installed, and every appliance brings specific requirements for cutout sizes, clearances, gas or electrical connections and ventilation. Download the installation guide for the exact model before finalizing the drawings.</p>` },
{ id: `m8l2`, t: `Refrigeration & cleanup`, min: 25, h: `
<h3>Refrigeration</h3>
<table><thead><tr><th>Type</th><th>Notes</th></tr></thead><tbody>
<tr><td>Top- or bottom-freezer</td><td>Economical; bottom-freezer puts fresh food at eye level</td></tr>
<tr><td>French door</td><td>Narrow door swings; freezer drawer below</td></tr>
<tr><td>Side-by-side</td><td>Narrow door swings; narrow shelves</td></tr>
<tr><td>Column</td><td>Separate full-height refrigerator and freezer units, often panel-ready</td></tr>
<tr><td>Built-in</td><td>About 24" deep, flush with cabinetry, often panel-ready</td></tr>
<tr><td>Counter-depth freestanding</td><td>Shallower than standard, though it may still project past the cabinets</td></tr>
<tr><td>Undercounter</td><td>Refrigerator drawers, beverage centers, wine storage, ice makers</td></tr>
</tbody></table>
<p>Plan for door swing: most refrigerators need their doors to open beyond 90° to remove bins and shelves, so beside a wall use a filler or panel, or a model designed for zero clearance. Put the handle side toward the landing area and prep space. Provide a water line for ice and water, follow the maker's ventilation requirements (built-ins typically vent at the front), and use a 24"-deep cabinet above so it's reachable. Keep refrigerators away from ranges and ovens unless the manufacturer's spacing or insulation requirements are met.</p>
<h3>Dishwashers</h3>
<p>Standard dishwashers are 24" wide; compact models are 18"; drawer dishwashers come in single and double versions. Place the dishwasher next to the sink (within 36") with 21" of standing space, near dish storage, and where its open door won't block drawers or cabinets on an adjacent wall. Quiet models are rated in dBA: lower is quieter. Raised dishwashers and dishwasher drawers reduce bending. Busy households often appreciate a second dishwasher.</p>
<h3>Disposers and more</h3>
<p>Disposers mount under the sink and need a switch (wall or countertop air switch) and power; check septic-system compatibility. Also plan for trash compactors, waste and recycling pull-outs, water filtration and instant-hot dispensers. ENERGY STAR ratings help compare efficiency.</p>` },
{ id: `m8l3`, t: `Ventilation`, min: 30, h: `
<p>Cooking releases heat, moisture, grease, odors and fine particles, and gas burners add combustion by-products. Ventilation protects indoor air quality and the finishes, and NKBA recommends a correctly sized, ducted ventilation system for every cooking surface, with a minimum of 150 CFM.</p>
<h3>Hood types</h3>
<p>Wall-mount chimney hoods, under-cabinet hoods, liners or inserts inside custom hoods, island hoods, downdraft units that pull from behind the cooktop, over-the-range microwaves (usually the weakest option) and flush ceiling units (which need high airflow because they sit far from the source).</p>
<h3>Capture comes first</h3>
<p>A hood can only exhaust what it captures. The hood should be at least as wide as the cooking surface, ideally 3" wider on each side, and deep enough to cover the front burners. Island hoods face cross-drafts and benefit from even more width. Mount it at the height the manufacturer specifies, commonly 24"–30" above the cooking surface and sometimes higher over professional ranges.</p>
<fig name="hood">A 36" hood over a 30" range extends 3" beyond the cooktop on each side. The rising plume spreads as it climbs, which is why width and mounting height matter as much as airflow.</fig>
<h3>Sizing rules of thumb</h3>
<ul>
<li><b>Gas:</b> about 1 CFM per 100 BTU of total burner output. A range with 60,000 BTU total calls for about 600 CFM.</li>
<li><b>Electric or induction:</b> about 100 CFM per linear foot of cooktop width for wall hoods and 150 CFM per foot for island hoods. A 30" cooktop under a wall hood needs about 250 CFM.</li>
<li>Use at least 150 CFM, and follow the hood manufacturer where its recommendation is higher.</li>
</ul>
<h3>Ducting</h3>
<ul>
<li>Vent outdoors, never into an attic, soffit or wall cavity.</li>
<li>Use smooth rigid metal duct, not flex, sized to the manufacturer's outlet; never reduce the diameter.</li>
<li>Keep runs short and straight. Each elbow adds as much resistance as many feet of straight duct.</li>
<li>Terminate with a backdraft damper, seal joints with foil tape, and insulate duct in cold spaces to prevent condensation.</li>
</ul>
<aside class="warn"><p><b>Makeup air.</b> The IRC requires makeup air for kitchen exhaust systems capable of exhausting more than 400 CFM. Without it, a powerful hood depressurizes the house, performs poorly, and can backdraft fuel-burning appliances such as water heaters and furnaces, pulling carbon monoxide indoors.</p></aside>
<p><b>Recirculating (ductless) hoods</b> filter grease and some odors but return heat, moisture and combustion gases to the room; treat them as a last resort. Noise is rated in sones; remote or inline blowers reduce noise at the hood.</p>` }
],

COURSE.modules.push({
id: `m9`, n: 9, title: `Bathroom planning`,
sum: `Bath types and layouts, fixture clearances (model-code minimums versus recommended dimensions), selecting fixtures and fittings, and designing for safety, comfort and moisture control.`,
obj: [`Plan common bath types and layouts efficiently.`, `Apply code-minimum and recommended clearances to every fixture.`, `Select toilets, lavatories, tubs, showers, valves and vanities.`, `Design for safety: blocking, slip resistance, glazing, water temperature and ventilation.`],
lessons: [
{ id: `m9l1`, t: `Bath types & layouts`, min: 25, h: `
<p>Bathrooms are small, expensive per square foot, and unforgiving: an inch too little in front of a toilet is felt every day. Good bath planning starts with who uses the room and when.</p>
<h3>Bath types</h3>
<ul>
<li><b>Powder room (half bath):</b> toilet and lavatory, usually for guests.</li>
<li><b>Three-quarter bath:</b> toilet, lavatory and shower.</li>
<li><b>Full bath:</b> toilet, lavatory and tub (often a tub-shower combination).</li>
<li><b>Primary (en-suite) bath:</b> often two lavatories, a separate shower and tub, and a toilet compartment.</li>
<li><b>Jack-and-Jill:</b> shared between two bedrooms, sometimes with separate vanity areas.</li>
<li><b>Wet room:</b> the whole room is waterproofed and the shower is open to it.</li>
</ul>
<fig name="bathLayouts">Three layouts at the same scale. The classic 5' × 8' hall bath puts the tub across the 5' end with the toilet and vanity on one wall.</fig>
<h3>Layout principles</h3>
<ul>
<li><b>Wet walls:</b> grouping fixtures on one plumbing wall, or stacking baths above each other, saves cost.</li>
<li><b>The toilet drain</b> is the least flexible element. It needs a 3" drain with proper slope and venting, and moving it across joists or through a slab can be costly.</li>
<li><b>Privacy:</b> avoid making the toilet the first thing seen through the door.</li>
<li><b>Door swing:</b> make sure the door doesn't hit fixtures or block clear floor space; pocket doors save space in small baths.</li>
<li><b>Simultaneous users:</b> in shared baths, compartments and separate vanity areas let two people get ready at once.</li>
<li><b>Light and storage:</b> put towel storage and hooks near the shower and task lighting at the mirror.</li>
</ul>` },
{ id: `m9l2`, t: `Clearances: code vs. recommended`, min: 30, h: `
<p>Model codes set legal minimums; NKBA's guidelines describe comfortable, usable dimensions. Design to the recommendations whenever the space allows, and never below code.</p>
<table><thead><tr><th>Item</th><th>Model-code minimum (IRC)</th><th>Recommended (NKBA)</th></tr></thead><tbody>
<tr><td>Toilet or bidet centerline to side wall or obstacle</td><td>15"</td><td>18"</td></tr>
<tr><td>Clear space in front of toilet or lavatory</td><td>21"</td><td>30" (and a 30" × 48" clear floor space for access)</td></tr>
<tr><td>Lavatory centerline to side wall</td><td>15"</td><td>20"</td></tr>
<tr><td>Between two lavatory centerlines</td><td>30"</td><td>36"</td></tr>
<tr><td>Shower interior</td><td>900 sq in, at least 30" in every direction</td><td>36" × 36"</td></tr>
<tr><td>Shower entry opening</td><td>22" unobstructed; hinged doors open outward</td><td>Wider is easier</td></tr>
<tr><td>Ceiling height</td><td>80" in bathrooms</td><td>Plan for fixture use and showerhead height</td></tr>
<tr><td>Entry door</td><td></td><td>32" clear opening</td></tr>
</tbody></table>
<fig name="bathClear">Recommended clearances in plan. The code minimums are 15" to a centerline, 30" between lavatory centerlines, 21" in front of fixtures and a 30" × 30" shower.</fig>
<h3>Recommended heights and details</h3>
<ul>
<li>Toilet compartment: at least 36" × 66", with a swing-out or pocket door.</li>
<li>Mirror: bottom edge no higher than about 40" above the floor, so seated users and children can see themselves.</li>
<li>Shower controls: reachable from inside and outside the spray, about 38"–48" above the floor, offset toward the entry.</li>
<li>Shower seat: 17"–19" high and at least 15" deep, without shrinking the minimum shower size.</li>
<li>Grab bars: 33"–36" above the floor, with blocking in the walls.</li>
<li>Toilet paper holder: about 8"–12" in front of the bowl and about 26" above the floor.</li>
</ul>
<fig name="bathElev">A composite elevation showing typical mounting heights. The scale at right is in inches above the finished floor.</fig>
<aside class="tip"><p><b>Worked example.</b> A double vanity between two walls needs at least 15 + 30 + 15 = 60" by code, but 20 + 36 + 20 = 76" to meet the recommendations. A 72" vanity with sinks 36" apart places each sink 18" from its end, which is fine when the ends are open but tight when they meet walls.</p></aside>` },
{ id: `m9l3`, t: `Fixtures & fittings`, min: 30, h: `
<h3>Toilets</h3>
<ul>
<li><b>Types:</b> two-piece, one-piece, and wall-hung (tank in the wall on a carrier, which makes floor cleaning easy and allows a custom seat height).</li>
<li><b>Bowls:</b> round bowls are more compact; elongated bowls are about 2" longer and more comfortable.</li>
<li><b>Height:</b> "chair" or "comfort" height models put the seat about 17"–19" above the floor, easier for most adults.</li>
<li><b>Rough-in:</b> the distance from the finished wall to the center of the floor flange, usually 12", with 10" and 14" models available.</li>
<li><b>Water use:</b> the U.S. federal maximum is 1.6 gallons per flush; WaterSense-labeled toilets use 1.28 gpf or less. Bidet seats need a nearby GFCI-protected receptacle.</li>
</ul>
<h3>Lavatories and vanities</h3>
<p>Lavatories may be undermount, drop-in, vessel, integral, wall-hung, pedestal or console. With a vessel sink, lower the counter so the rim lands at a comfortable height, and pair it with a tall or wall-mount faucet. Faucets come as single-hole, 4" centerset, 8" widespread or wall-mount (plan the rough-in height and spout reach). Vanities are typically 21" deep (18" for tight spaces); 34"–36" "comfort height" vanities are now common, and floating vanities open up the floor. Plan drawers around plumbing, and consider an in-drawer outlet for hair tools.</p>
<h3>Tubs</h3>
<p>Alcove tubs (three walls, commonly 60" × 30" or 32"), drop-in or platform tubs, undermount tubs and freestanding tubs (floor- or wall-mounted fillers). Soaking, whirlpool (water jets) and air-bath versions are available in acrylic, enameled steel, cast iron and stone resin. Heavy tubs need a structural check, large tubs may need a bigger water heater, and jetted tubs need access panels for their pumps.</p>
<h3>Showers</h3>
<p>Choose prefabricated (acrylic or fiberglass) or tiled, curbed or curbless, with a point drain or linear drain. Glass enclosures must be safety glazing, and hinged doors open outward. A doorless walk-in shower needs enough length to contain the spray. Steam showers need vapor-proof construction, a sloped ceiling and a sealed door.</p>
<h3>Valves</h3>
<p>Shower and tub-shower valves must be pressure-balancing or thermostatic (or a combination) to prevent scalding; the IRC limits their maximum outlet temperature to 120°F. Thermostatic valves control temperature and volume separately and can serve several outlets. A handheld shower on a slide bar is useful for almost everyone; for accessibility its hose should be at least 59" long. Federal rules cap showerheads at 2.5 gpm; WaterSense models use 2.0 gpm or less.</p>
<aside class="warn"><p><b>Order valves early.</b> The valve body is installed at plumbing rough-in, before the walls close, and trim is brand- and model-specific. Choosing the shower trim late can mean opening a finished wall.</p></aside>` },
{ id: `m9l4`, t: `Safety, comfort & ventilation`, min: 25, h: `
<p>More home injuries happen in bathrooms than almost anywhere else in the house. Wet surfaces, hard edges, hot water and electricity all meet here, so safety features belong in every design, whether or not the client asks.</p>
<h3>Safety features</h3>
<ul>
<li><b>Blocking:</b> install solid blocking in the walls around the toilet, tub and shower during construction, even if grab bars aren't installed now. Document its location on the drawings.</li>
<li><b>Grab bars:</b> 33"–36" above the floor; decorative bars must be rated as grab bars, not just towel bars.</li>
<li><b>Slip resistance:</b> DCOF of at least 0.42 on floors walked on when wet; small shower-floor tiles add traction; avoid loose rugs.</li>
<li><b>Safety glazing:</b> glass in tub and shower enclosures and doors must be safety glazing, as must windows in walls around a tub or shower whose bottom edge is less than 60" above the standing surface.</li>
<li><b>Scald protection:</b> pressure-balancing or thermostatic valves.</li>
<li><b>Door hardware:</b> privacy locks that can be opened from outside in an emergency. An outswinging or pocket door can't be blocked by someone who falls against it.</li>
</ul>
<h3>Electrical</h3>
<p>Bathroom receptacles need GFCI protection, and the NEC requires at least one 20-amp circuit for bathroom receptacles and a receptacle within 36" of the outside edge of each basin. Keep receptacles and switches out of the zone around tubs and showers defined by current code, and use fixtures rated for damp or wet locations over tubs and showers.</p>
<h3>Ventilation</h3>
<p>Every bathroom needs an exhaust fan ducted outdoors. The IRC minimum is 50 CFM intermittent or 20 CFM continuous. A common sizing guideline is 1 CFM per square foot for bathrooms up to 100 square feet; for larger baths, allow 50 CFM for each toilet, shower and tub and 100 CFM for a jetted tub. Locate the fan near the shower (rated for the location if it's inside the enclosure), and use timer or humidity-sensing controls so it runs long enough to clear moisture. Look for quiet fans, about 1 sone or less, so people actually use them.</p>
<h3>Comfort</h3>
<ul>
<li>Electric radiant floor heat under tile, on a dedicated GFCI-protected circuit with its own thermostat.</li>
<li>Cross-illumination at the mirror: lights on both sides at about face height (Module 10).</li>
<li>Towel hooks within reach of the shower, niches for bottles, and recessed medicine cabinets (check the wall cavity for pipes and wires first).</li>
<li>Acoustic privacy: insulation in walls, solid-core doors and quiet fans.</li>
</ul>` }
],

id: `m10`, n: 10, title: `Mechanical systems & lighting`,
sum: `Enough plumbing, electrical and HVAC literacy to plan realistically and coordinate with the trades, plus layered lighting design for kitchens and baths.`,
obj: [`Explain supply and drain-waste-vent systems and what makes moving fixtures easy or costly.`, `Apply common electrical requirements for kitchens and baths.`, `Design layered lighting with the right lumens, color temperature and CRI.`, `Produce a legible mechanical and lighting plan.`],
lessons: [
{ id: `m10l1`, t: `Plumbing essentials`, min: 30, h: `
<p>You won't size pipes or design venting; licensed plumbers do that under the local plumbing code. But knowing how the systems work lets you plan layouts that are practical to build and budget honestly for the ones that aren't.</p>
<h3>Supply</h3>
<p>Supply lines carry pressurized hot and cold water, usually in copper, PEX or CPVC. Branch lines to fixtures are typically 1/2", with smaller supply risers to each fixture and a shutoff (stop) valve at every fixture. Plumbing codes generally cap static water pressure at 80 psi, with a pressure-reducing valve required above that. Hot water comes from a tank or tankless heater; long runs may call for a recirculation system, and large tubs may need a bigger heater.</p>
<h3>Drain, waste and vent (DWV)</h3>
<p>Drains work by gravity, so pipes must slope. The IRC calls for at least 1/4" per foot for pipes 2-1/2" and smaller and 1/8" per foot for 3" and larger. Every fixture has a <b>trap</b> whose water seal blocks sewer gas; toilets have the trap built in. <b>Vents</b> let air into the system so flowing water doesn't siphon the traps dry, and they carry sewer gas out through the roof.</p>
<fig name="dwv">A sink drain: tailpiece, P-trap with its water seal, a trap arm sloping to the vent stack, and supplies with stop valves.</fig>
<table><thead><tr><th>Fixture</th><th>Typical trap or drain size</th></tr></thead><tbody>
<tr><td>Lavatory</td><td>1-1/4"</td></tr>
<tr><td>Kitchen sink</td><td>1-1/2"</td></tr>
<tr><td>Bathtub</td><td>1-1/2"</td></tr>
<tr><td>Shower</td><td>2"</td></tr>
<tr><td>Toilet</td><td>3" drain (trap built into the toilet)</td></tr>
</tbody></table>
<h3>Trap arms and islands</h3>
<p>The trap arm, the pipe from the trap to its vent, has a maximum length that depends on its diameter. Under the IRC, for example, a 1-1/2" trap arm can run up to 6 feet and a 2" arm up to 8 feet. Island sinks have no wall to hide a vent in, so plumbers use an island loop vent or, where the local code permits, an air admittance valve (AAV).</p>
<h3>What's easy and what's costly</h3>
<ul>
<li>Moving a sink a few feet along the same wall is usually straightforward.</li>
<li>Moving a toilet is harder: its 3" drain needs slope, venting and a path that may cross joists, and on a slab it means cutting concrete.</li>
<li>Stacking bathrooms and sharing wet walls saves money.</li>
<li>Gas appliances need a properly sized line and an accessible shutoff; gas work is for licensed professionals.</li>
</ul>
<aside class="tip"><p><b>Coordinate the sink base.</b> Drain height and supply locations decide whether you can use U-shaped drawers or a pull-out waste bin under the sink. Put them on the drawings.</p></aside>` },
{ id: `m10l2`, t: `Electrical essentials`, min: 30, h: `
<p>These are common U.S. requirements based on the National Electrical Code. Jurisdictions adopt different editions and amend them, so confirm local rules with the electrician and building department.</p>
<h3>Kitchen circuits</h3>
<ul>
<li>At least two 20-amp small-appliance branch circuits serve the countertop receptacles.</li>
<li>Many appliances need their own circuits, depending on code and the manufacturer: dishwasher, disposer, microwave, refrigerator and hood. Ranges, cooktops and wall ovens need 240-volt circuits sized to the model.</li>
<li><b>GFCI</b> protection is required for kitchen receptacles (recent editions extend it to all kitchen receptacles, not just those serving the counter) and increasingly for appliances such as dishwashers.</li>
<li><b>AFCI</b> protection is also required for kitchen outlets under recent editions; combination AFCI/GFCI devices and breakers cover both.</li>
</ul>
<h3>Countertop receptacles</h3>
<ul>
<li>Every wall counter space 12" or wider needs a receptacle.</li>
<li>Receptacles are placed so no point along the wall line is more than 24" from one, which puts them at most 48" apart.</li>
<li>Counter spaces separated by a range, refrigerator or sink count as separate spaces.</li>
<li>Receptacles serving the counter must be no more than 20" above it.</li>
<li>Island and peninsula rules have changed across recent editions; the 2023 NEC, for instance, no longer requires an island receptacle but requires provisions for adding one later. Confirm which edition applies.</li>
</ul>
<fig name="receptacles">Coverage zones along a counter. The 96" run needs two receptacles; the 30" and 12" spaces separated by the sink and range each need their own.</fig>
<h3>Bathrooms</h3>
<p>At least one 20-amp circuit serves the bathroom receptacles, all receptacles need GFCI protection, and a receptacle must be within 36" of the outside edge of each basin. Receptacles aren't allowed in the zone around tubs and showers defined by current code, and luminaires there must be rated for damp or wet locations.</p>
<h3>Switching and controls</h3>
<p>Put a switch at every entry, with three-way switches for rooms with two entries. Switch lighting layers separately and put them on LED-compatible dimmers. Consider occupancy sensors for pantries and closets. Switches are commonly mounted around 42"–48" above the floor; universal design favors the lower end.</p>
<aside class="warn"><p><b>Check capacity early.</b> An induction cooktop, double oven, heated floors and a steam shower can exceed an older panel's capacity. Find out at the site visit, not after the appliances are ordered.</p></aside>` },
{ id: `m10l3`, t: `Lighting design`, min: 30, h: `
<p>Lighting is the most underestimated element in K&amp;B design. It determines whether a kitchen is safe to cook in, whether finishes look the way they did in the showroom, and whether a bath mirror flatters or frightens.</p>
<h3>Layers</h3>
<ul>
<li><b>Ambient (general):</b> recessed, surface or cove lighting that fills the room.</li>
<li><b>Task:</b> focused light where work happens: under-cabinet lights, pendants over an island, vanity lighting.</li>
<li><b>Accent:</b> light that highlights, such as in-cabinet, toe-kick or tile-washing light.</li>
<li><b>Decorative:</b> fixtures that are part of the design, like a statement pendant or chandelier.</li>
<li><b>Natural light:</b> windows and skylights, with glare and privacy control.</li>
</ul>
<fig name="lightingLayers">Layered kitchen lighting in section. Ambient lights sit over the counter edge so the cook doesn't shadow the work; under-cabinet lights mount toward the front.</fig>
<h3>Measuring light</h3>
<table><thead><tr><th>Term</th><th>Meaning</th><th>Guidance</th></tr></thead><tbody>
<tr><td>Lumens</td><td>Light output of a lamp or fixture</td><td>Compare fixtures by lumens, not watts</td></tr>
<tr><td>Footcandles</td><td>Light arriving on a surface (lumens per square foot)</td><td>Work surfaces need much more than general areas; around 50 fc is a common kitchen task target</td></tr>
<tr><td>Color temperature (CCT)</td><td>Warmth of white light, in kelvins</td><td>2700 K warm, 3000 K warm-white, 3500 K neutral, 4000 K cool; keep one CCT per room</td></tr>
<tr><td>CRI</td><td>How accurately light renders color, 0–100</td><td>Specify 90+ so food, skin and finishes look right</td></tr>
<tr><td>Beam angle</td><td>Spread of a directional light</td><td>Narrow beams accent; wide beams wash</td></tr>
</tbody></table>
<h3>Kitchen placement</h3>
<ul>
<li>NKBA's guideline: every work surface should be well lit by task lighting.</li>
<li>Center perimeter recessed lights roughly over the counter's front edge, commonly about 24"–30" from the wall, so the cook's head doesn't shadow the counter and the light clears the wall cabinets.</li>
<li>Mount under-cabinet lights toward the front of the cabinet bottom, behind a light rail, for even light on counter and backsplash with less glare on glossy tops.</li>
<li>Hang island pendants with their bottoms about 30"–36" above the counter, spaced so their light overlaps.</li>
<li>Recessed spacing starts at about half the ceiling height and is refined with the fixture's photometrics.</li>
</ul>
<h3>Bath placement</h3>
<p>Light the face from both sides: sconces or vertical fixtures flanking the mirror at about face height, roughly 60"–66" above the floor, or a lighted mirror. A single downlight over the vanity casts shadows under the eyes and chin. Use wet-rated fixtures in showers, a low night light for safety, and dimmers throughout.</p>
<h3>Lighting for older eyes</h3>
<p>Older eyes need considerably more light and are more sensitive to glare. Layer indirect and diffuse light, choose matte or honed surfaces where glare is a problem, and give every task area its own light.</p>
<h3>HVAC coordination</h3>
<p>Don't bury supply registers under cabinets; relocate them to toe-kick registers or walls. Keep return air paths open, coordinate makeup air for large hoods (Module 8), and consider radiant floor heat in baths.</p>` }
],

id: `m11`, n: 11, title: `Universal design & accessibility`,
sum: `Designing kitchens and baths that work for people of every age, size and ability: the principles, the key dimensions, and the product and detail choices that make independence easier.`,
obj: [`Explain the seven principles of universal design.`, `Distinguish universal, accessible, adaptable and aging-in-place design, and know where the ADA applies.`, `Apply clear floor space, turning space, knee space and reach-range dimensions.`, `Specify products and details that improve safety and independence.`],
lessons: [
{ id: `m11l1`, t: `Principles & key dimensions`, min: 25, h: `
<p>Universal design is design that is usable by all people, to the greatest extent possible, without the need for adaptation or specialized design. The concept grew from the work of architect Ron Mace and the Center for Universal Design at North Carolina State University. In practice it means a kitchen that works for a tall cook, a child, a wheelchair user and a grandparent with arthritis, without looking like a medical facility.</p>
<h3>The seven principles</h3>
<ol>
<li><b>Equitable use:</b> useful to people with diverse abilities.</li>
<li><b>Flexibility in use:</b> accommodates a range of preferences and abilities, such as multiple counter heights.</li>
<li><b>Simple and intuitive use:</b> easy to understand regardless of experience.</li>
<li><b>Perceptible information:</b> communicates effectively, for example through contrast and clear controls.</li>
<li><b>Tolerance for error:</b> minimizes hazards, such as rounded corners and anti-scald valves.</li>
<li><b>Low physical effort:</b> usable efficiently and comfortably, such as lever handles and full-extension drawers.</li>
<li><b>Size and space for approach and use:</b> room to reach, approach and use, whatever the user's body size, posture or mobility.</li>
</ol>
<h3>Related terms</h3>
<ul>
<li><b>Accessible design</b> meets specific technical standards for people with disabilities: the ADA Standards for public and commercial facilities, the ICC A117.1 technical standard, and the Fair Housing Act's design requirements for certain multifamily housing. Private single-family homes generally aren't required to follow the ADA, but its dimensions are excellent references.</li>
<li><b>Adaptable design</b> includes features that can be adjusted or added later, such as removable base cabinets that open up knee space or wall blocking for future grab bars.</li>
<li><b>Aging in place</b> lets people stay safely in their homes as they age. NAHB's CAPS credential focuses on it.</li>
<li><b>Visitability</b> is a basic level of access: a zero-step entrance, wide doors and a usable bathroom on the main level.</li>
</ul>
<h3>Key dimensions</h3>
<fig name="udSpace">Clear floor space, the turning circle and the T-shaped turn.</fig>
<table><thead><tr><th>Element</th><th>Dimension</th></tr></thead><tbody>
<tr><td>Clear floor space at a fixture or appliance</td><td>30" × 48", forward or parallel approach</td></tr>
<tr><td>Turning space</td><td>60" diameter circle, or a T-shaped space within a 60" square with 36"-wide arms</td></tr>
<tr><td>Knee space</td><td>At least 27" high and 30" wide, 17"–25" deep</td></tr>
<tr><td>Unobstructed reach range</td><td>15"–48" above the floor, forward or side</td></tr>
<tr><td>Work surface for seated users</td><td>28"–34" high</td></tr>
<tr><td>Doors</td><td>32" clear opening minimum (a 36" door is better); lever handles; low, beveled thresholds</td></tr>
<tr><td>Controls</td><td>Operable with one hand, without tight grasping, pinching or twisting</td></tr>
</tbody></table>
<fig name="reachRange">The reach range from 15" to 48". Standard wall cabinets start at 54", beyond the reach of seated users.</fig>` },
{ id: `m11l2`, t: `Applying universal design`, min: 25, h: `
<p>Universal design works best when it's invisible: features that make the room easier for everyone and happen to make it possible for some. Here are practical strategies, room by room.</p>
<h3>Kitchens</h3>
<ul>
<li><b>Multiple counter heights:</b> a 30"–34" section for seated prep or baking, standard 36" counters, and perhaps a 42" bar.</li>
<li><b>Drawers instead of doors</b> in base cabinets, on full-extension slides with D-shaped pulls that are easy to grip.</li>
<li><b>Reachable upper storage:</b> lower wall cabinets (for example 15" above the counter), pull-down shelf systems, and tall pantries with pull-outs.</li>
<li><b>Appliances:</b> side-swing or slide-under wall ovens near counter height; an induction cooktop with front or side controls; a microwave drawer; a raised dishwasher or dishwasher drawers; a French-door or side-by-side refrigerator with a freezer drawer.</li>
<li><b>Knee space</b> at the sink or cooktop, with pipes insulated or panelled so knees don't touch hot or sharp surfaces.</li>
<li><b>Faucets:</b> single-lever, touch or motion activation, pull-down sprayers, and a pot filler to avoid carrying heavy pots.</li>
<li><b>Contrast:</b> countertop edges that contrast with cabinets and floors, and good light everywhere, with lit toe-kicks as a night path.</li>
</ul>
<h3>Bathrooms</h3>
<ul>
<li><b>Curbless shower</b> with a linear drain, a handheld shower on a slide bar (hose at least 59"), a bench 17"–19" high, and controls offset toward the entry so they can be reached from outside the spray.</li>
<li><b>Grab bars</b> at the toilet, tub and shower, or at minimum blocking documented on the drawings for future bars.</li>
<li><b>Toilets:</b> comfort height (17"–19" to the seat), with the centerline 16"–18" from a side wall so a grab bar is within reach; wall-hung toilets can be set at a custom height.</li>
<li><b>Vanities:</b> a floating vanity or knee-space lavatory, lever faucet, and a mirror that reaches down to about 40" above the floor or tilts.</li>
<li><b>Floors and doors:</b> slip-resistant floors without thresholds, wider doors, and pocket or outswinging doors so a person who falls can't block the door.</li>
<li><b>Lighting:</b> bright, even, glare-free light and a night light.</li>
</ul>
<aside class="tip"><p><b>Design it in, not on.</b> Blocking costs little during construction and a great deal later. A curbless shower is far easier to build during a remodel than to retrofit. Raise these options with every client, whatever their age today.</p></aside>` }
],

sum: `Presenting designs that win approval, estimating and contracting, and managing installation from demolition to the final walkthrough, with notes on permits and sustainable choices.`,
obj: [`Assemble a complete presentation and specification package.`, `Build a budget and understand typical cost allocations and pricing math.`, `Use contracts, allowances and change orders to protect the project.`, `Sequence installation and coordinate trades, permits and inspections.`],
lessons: [
{ id: `m12l1`, t: `Presentations, estimates & contracts`, min: 25, h: `
<h3>Presenting the design</h3>
<p>Tell the story in the client's terms. Start from the goals in their design program, then show how the plan answers each one: floor plan first, then elevations and renderings, then physical samples viewed in the actual room's light. Present options with their price differences, and write down every decision the client makes.</p>
<h3>Specifications</h3>
<p>List every product and finish with manufacturer, model number, size, finish, quantity, supplier, who installs it, and lead time. Flag owner-furnished items clearly, because responsibility for their delivery, condition and fit must be settled in writing.</p>
<h3>Estimating</h3>
<p>An estimate includes products (cabinets, counters, appliances, fixtures, tile, lighting), labor (demolition, carpentry, plumbing, electrical, drywall, tile, paint), permits, design fees, disposal, and a <b>contingency</b> for unknowns, commonly 10%–20% on remodels.</p>
<fig name="budget">A commonly cited allocation of a kitchen remodel budget, based on NKBA industry data. Your region and project will differ, but cabinetry is almost always the largest share.</fig>
<h3>Pricing math: markup vs. margin</h3>
<p><b>Markup</b> is a percentage added to cost; <b>margin</b> is a percentage of the selling price. A product that costs $1,000 sold at a 40% markup is $1,400, which is only a 28.6% margin. To earn a 40% margin, divide cost by 0.60: $1,000 ÷ 0.60 = $1,666.67. Confusing the two is one of the most common ways small design firms lose money.</p>
<h3>Contracts</h3>
<p>A sound agreement identifies the parties and the scope of work, incorporates the drawings and specifications by reference, and states the price and payment schedule (deposit, progress payments, final payment). It lists <b>allowances</b> (budget amounts for items not yet selected), exclusions, schedule and lead-time assumptions, the change-order process, warranties, dispute resolution, who pulls permits, and licensing and insurance information. Many jurisdictions require specific home-improvement contract terms, such as a right-to-cancel period for contracts signed in the home. Use contract forms reviewed by an attorney where you practice.</p>
<h3>Change orders</h3>
<p>Any change to scope, price or schedule is written up, priced and signed before the work proceeds. Change orders protect both sides and keep the final invoice free of surprises.</p>` },
{ id: `m12l2`, t: `Project management & installation`, min: 25, h: `
<p>Installation is where designs meet reality. A clear sequence, early ordering and good documentation keep projects on schedule and clients calm.</p>
<fig name="sequence">A typical ten-week kitchen remodel after products are ordered. Red diamonds are inspections; counter fabrication is the long wait between templating and installation.</fig>
<ol>
<li><b>Before construction:</b> permits, orders placed and lead times confirmed, schedule set, protection plan, a temporary kitchen for the client.</li>
<li><b>Protection and demolition,</b> with dust control and any hazardous-material procedures.</li>
<li><b>Framing and structural changes;</b> window and door changes.</li>
<li><b>Rough-in:</b> plumbing (including shower valves), electrical, HVAC, hood ducting and blocking.</li>
<li><b>Rough-in inspections</b> before walls are closed.</li>
<li><b>Insulation, drywall and backer board.</b></li>
<li><b>Prime paint and flooring,</b> often before cabinets.</li>
<li><b>Cabinet installation,</b> leveled from the high point and fastened to studs.</li>
<li><b>Countertops:</b> template, fabricate and install.</li>
<li><b>Backsplash and tile;</b> shower glass is measured after the tile is set.</li>
<li><b>Trim-out:</b> plumbing fixtures, electrical devices and lights, appliances, hardware and trim.</li>
<li><b>Final inspection, cleaning, punch list and walkthrough,</b> with care and warranty documents, final payment, photography and follow-up.</li>
</ol>
<h3>Coordination habits</h3>
<ul>
<li>Track every long-lead item on a list with order date, promised date and confirmation.</li>
<li>Inspect deliveries immediately and note damage on the delivery receipt.</li>
<li>Photograph every wall after rough-in and before insulation or drywall. Those photos show exactly where pipes, wires and blocking are, which prevents nails through pipes and speeds future repairs.</li>
<li>Hold regular site meetings and keep a communication log.</li>
<li>Set expectations about dust, noise, delays and decisions still to be made.</li>
</ul>
<h3>Codes, permits and inspections</h3>
<p>Structural, plumbing, electrical and mechanical changes generally require permits and inspections. Model codes such as the IRC and NEC, and the IPC or UPC for plumbing, are adopted and amended locally, so the building department is the final word. Licensed trades pull their own permits in many jurisdictions.</p>
<h3>Sustainable choices</h3>
<ul>
<li>WaterSense fixtures and ENERGY STAR appliances; induction cooking; LED lighting with good controls.</li>
<li>Low-VOC finishes and adhesives, and composite wood that meets formaldehyde limits.</li>
<li>Durable, repairable materials and FSC-certified wood.</li>
<li>Recycling demolition waste and donating usable cabinets and appliances, for example to a Habitat for Humanity ReStore.</li>
<li>Right-sized ventilation with makeup air for good indoor air quality.</li>
</ul>` }
],

COURSE.capstone = { min: 150, title: `Capstone project`,
brief: `
<p>Design a kitchen and a hall bath for the Alvarez-Chen household. Treat it as a real project: work from the brief, apply the guidelines, and produce a drawing and specification package you could present to a client.</p>
<h3>The clients</h3>
<ul>
<li>Marisol (5'-4", left-handed) and David (6'-1"), both in their mid-50s, and their 16-year-old son. Marisol bakes; David cooks on weeknights; they often cook together.</li>
<li>They host 8–10 guests about once a month and want the kitchen to stay open to the family room.</li>
<li>They plan to stay at least 15 years and want to age in place.</li>
<li>Style words: warm, simple, natural wood, soft black accents.</li>
</ul>
<h3>Kitchen</h3>
<ul>
<li>Room 168" (walls A and C) × 156" (walls B and D), ceiling 96". The house was built in 1992; it has a 200-amp panel with open spaces and natural gas.</li>
<li>Wall A (north): a 48" window, casing to casing, centered, with the bottom of the casing at 42" AFF. The existing sink drain is centered on the window.</li>
<li>Wall B (east): exterior wall with no openings; a hood can vent through it.</li>
<li>Wall C (south): a 42" cased opening to the dining room, starting 24" from the corner with wall D.</li>
<li>Wall D (west): a 32" door to the mudroom (38" with casings), starting 18" from the corner with wall C.</li>
<li>Wants: an island seating three, a real pantry, a lower baking counter, a 36" range, and recycling at the sink. Budget: $95,000 including appliances.</li>
</ul>
<h3>Hall bath</h3>
<ul>
<li>60" × 96", ceiling 96". The existing tub runs across the 60" wall, with the toilet and vanity on one long wall and the door on the other.</li>
<li>Convert the tub to a curbless walk-in shower, keep a single vanity, add storage, and plan for aging in place. Budget: $28,000.</li>
</ul>`,
deliverables: [`A one-page design program covering both rooms`, `Kitchen floor plan at 1/2" = 1'-0" with dimensions and cabinet codes`, `Kitchen elevations of every wall with cabinetry`, `Kitchen mechanical and lighting plan with legend`, `Countertop plan with edges, seams and cutouts`, `Bath floor plan plus vanity and shower elevations with clearances and heights`, `Appliance and fixture schedule with hood CFM and bath fan CFM calculations`, `Guideline checklist with the measured value for each item`, `Budget allocation and week-by-week schedule`, `Self-assessment against the rubric`],
rubric: [
[`Function and guidelines`, `Every NKBA guideline is met or the exception is documented with a reason; code minimums are never violated.`],
[`Drawings`, `Correct line weights and symbols, tiered dimensions that add up, cabinet codes, door-swing indicators and complete title blocks.`],
[`Specifications`, `Every product has model, size, finish, utility needs and lead time; hood and fan sizing are shown.`],
[`Universal design`, `Multiple counter heights, reachable storage, a curbless shower with blocking, bench and handheld shower, contrast and good lighting.`],
[`Aesthetics`, `A clear concept, one focal point, and cohesive finishes that match the clients' style words.`],
[`Communication`, `A program and checklist a client could follow, with decisions and assumptions stated.`]
] };
